/* Produktová karta: v tmavém režimu bez podkladu, tmavá modrá jen na hover; karty blíž k sobě */

/* VyberRadek (18. 11. 2026): řádek výběru varianty na detailech – vlevo check / kolečko, po výběru fotka se zvětšením, název a varianta, příplatek, tlačítko Vybrat/Změnit */
.ss-vyr{position:relative;display:block;width:100%;container-type:inline-size;container-name:ss-vyr;}
.ss-vyr-main{display:flex;align-items:center;gap:16px;width:100%;min-height:72px;box-sizing:border-box;text-align:left;padding:14px 16px;border:1px solid var(--ss-border-subtle,#E1E6EB);border-radius:12px;background:var(--ss-surface-box,#FFFFFF);box-shadow:0 2px 8px rgba(19,44,67,.08);cursor:pointer;font-family:inherit;color:inherit;transition:box-shadow .15s cubic-bezier(.22,.61,.36,1),border-color .12s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){.ss-vyr:not([data-pos]) .ss-vyr-main:hover,.ss-vyr[data-pos=""] .ss-vyr-main:hover{border-color:var(--ss-hover-text,#A4600C);box-shadow:0 4px 12px rgba(19,44,67,.12);}.ss-vyr-main:hover .ss-vyr-dot{border-color:var(--ss-hover-text,#A4600C);}.ss-vyr-main:hover .ss-vyr-cta[data-pri="true"]{background:#296093;}.ss-vyr-main:hover .ss-vyr-cta[data-pri="false"]{background:var(--ss-surface-muted,#F3EDE4);}}
.ss-vyr-main:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
html[data-mode="dark"] .ss-vyr-main{box-shadow:inset 0 1px 0 rgba(141,179,211,.14),0 0 0 1px rgba(141,179,211,.10),0 2px 8px rgba(0,0,0,.35);}
.ss-vyr[data-warn="true"] .ss-vyr-main{box-shadow:inset 0 0 0 2px #B3261E;background:#FDF0EF;}
/* spojená skupina (např. polštář + povlak): jeden box, linka mezi řádky, bez hoveru řádku */
.ss-vyr[data-pos="first"] .ss-vyr-main,.ss-vyr[data-pos="middle"] .ss-vyr-main,.ss-vyr[data-pos="last"] .ss-vyr-main{box-shadow:none;}
.ss-vyr[data-pos="first"] .ss-vyr-main{border-radius:12px 12px 0 0;}
.ss-vyr[data-pos="middle"] .ss-vyr-main{border-radius:0;border-top:0;}
.ss-vyr[data-pos="last"] .ss-vyr-main{border-radius:0 0 12px 12px;border-top:0;}
.ss-vyr[data-pos="first"]{box-shadow:0 2px 8px rgba(19,44,67,.08);border-radius:12px 12px 0 0;}
.ss-vyr[data-pos="middle"]{box-shadow:0 2px 8px rgba(19,44,67,.08);}
.ss-vyr[data-pos="last"]{box-shadow:0 2px 8px rgba(19,44,67,.08);border-radius:0 0 12px 12px;}
.ss-vyr-check{display:flex;align-items:center;justify-content:center;width:26px;height:26px;flex:none;border-radius:999px;background:#FBB255;color:#1C2229;box-shadow:0 2px 8px rgba(19,44,67,.08);}
.ss-vyr-dot{width:22px;height:22px;margin:0 2px;flex:none;box-sizing:border-box;border-radius:999px;border:2px solid var(--ss-border-strong,#C8D0D8);background:var(--ss-surface-page,#FFFFFF);transition:border-color .12s cubic-bezier(.22,.61,.36,1);}
.ss-vyr-img{display:block;width:76px;height:64px;flex:none;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(19,44,67,.12);}
.ss-vyr-ph{display:flex;align-items:center;justify-content:center;background:var(--ss-surface-subtle,#FAF5EF);color:var(--ss-text-muted,#5B6874);}
.ss-vyr-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}

/* zvětšení fotky – samostatné tlačítko nad náhledem (jako miniatury v draweru) */
.ss-vyr-zoom{position:absolute;left:58px;top:50%;transform:translateY(-50%);width:76px;height:64px;padding:0;border:0;border-radius:8px;background:none;cursor:zoom-in;}
.ss-vyr-zi{position:absolute;right:3px;bottom:3px;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.92);color:var(--ss-link-hover,#21507B);box-shadow:0 1px 4px rgba(19,44,67,.18);pointer-events:none;}
@media (hover:hover) and (pointer:fine){.ss-vyr-zoom:hover{box-shadow:inset 0 0 0 2px var(--ss-border-hover,#8DB3D3);}.ss-vyr-zoom:hover .ss-vyr-zi{background:#FFFFFF;color:var(--ss-hover-text,#A4600C);}}
.ss-vyr-zoom:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
/* úzký sloupec (např. detail na šířce L): příplatek pod variantou */
@container ss-vyr (max-width:520px){.ss-vyr-nt{display:none;}.ss-vyr-nm{display:block;}}
@media (max-width:719px){
.ss-vyr-main{gap:12px;padding:12px;}
.ss-vyr-img{width:48px;height:48px;}
.ss-vyr-zoom{left:50px;width:48px;height:48px;}
.ss-vyr-t{font-size:18px;}
.ss-vyr-nt{display:none;}
.ss-vyr-nm{display:block;}
}
</style>
</helmet>
<div class="ss-vyr" id="{{ rowId }}" data-warn="{{ warnStr }}" data-pos="{{ pos }}">
  <button type="button" class="ss-vyr-main" onClick="{{ open }}" aria-haspopup="dialog" aria-label="{{ aria }}">
    <sc-if value="{{ selected }}" hint-placeholder-val="{{ true }}"><span class="ss-vyr-check" aria-hidden="true"><dc-import name="Ikony" iconName="check" size="16" hint-size="16px,16px"></dc-import></span></sc-if>
    <sc-if value="{{ notSelected }}" hint-placeholder-val="{{ false }}"><span class="ss-vyr-dot" aria-hidden="true"></span></sc-if>
    <sc-if value="{{ hasThumb }}" hint-placeholder-val="{{ true }}"><span class="ss-vyr-img" aria-hidden="true" style="{{ thumbStyle }}"></span></sc-if>
    <sc-if value="{{ hasPh }}" hint-placeholder-val="{{ false }}"><span class="ss-vyr-img ss-vyr-ph" aria-hidden="true"><dc-import name="Ikony" iconName="photo" size="24" hint-size="24px,24px"></dc-import></span></sc-if>
    <span class="ss-vyr-tx">
      <span class="ss-vyr-t">{{ title }}</span>
      <span class="ss-vyr-v">{{ value }}</span>
      <sc-if value="{{ showNote }}" hint-placeholder-val="{{ true }}"><span class="ss-vyr-nm" style="{{ noteStyle }}">{{ note }}</span></sc-if>
    </span>
    <sc-if value="{{ showNote }}" hint-placeholder-val="{{ true }}"><span class="ss-vyr-nt" style="{{ noteStyle }}">{{ note }}</span></sc-if>
    <span class="ss-vyr-cta" data-pri="{{ ctaPri }}">{{ ctaLabel }}</span>
  </button>
  <sc-if value="{{ hasZoom }}" hint-placeholder-val="{{ true }}">
    <button type="button" class="ss-vyr-zoom" onClick="{{ zoom }}" aria-label="{{ zoomAria }}" title="Zvětšit fotku"><span class="ss-vyr-zi" aria-hidden="true"><dc-import name="Ikony" iconName="arrows-maximize" size="14" hint-size="14px,14px"></dc-import></span></button>
  </sc-if>
  <dc-import name="Overlay" open="{{ zoomOpen }}" variant="drawer" size="lg" obsah="NahledObsah" title="{{ zoomTitle }}" icon="photo" closeLabel="náhled" initialFocus="close" data="{{ zoomData }}" onClose="{{ closeZoom }}" primaryLabel="{{ zoomPrimary }}" onPrimary="{{ zoomChange }}" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 640, &quot;height&quot;: 120}, &quot;title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Materiál a odstín&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;value&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Dub · Transparent&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;note&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;+ 4 200 Kč&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;noteColor&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;selected&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;warn&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;image&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;swatch&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;#C9A57A&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;fit&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;cover&quot;, &quot;options&quot;: [&quot;cover&quot;, &quot;contain&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;cta&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;canChange&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;position&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;&quot;, &quot;options&quot;: [&quot;&quot;, &quot;first&quot;, &quot;middle&quot;, &quot;last&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;rowId&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
// VyberRadek (18. 11. 2026): jeden řádek výběru varianty na detailech produktů. Stránka posílá data propem a reaguje na onOpen (otevře svůj drawer výběru).
// Po výběru (selected) se vedle checku ukáže náhled (image, jinak swatch = CSS pozadí) a u fotky ikona zvětšení; zvětšení otevře Overlay drawer + NahledObsah s tlačítkem „Změnit výběr“ (= onOpen).
// position: '' samostatný řádek s hoverem, first / middle / last = spojená skupina v jednom boxu bez hoveru řádku.
class Component extends DCLogic {
  state = { zoom: false };
  renderVals() {
    const p = this.props;
    const yes = (v) => v === true || v === 'true';
    const sel = yes(p.selected);
    const img = p.image || '';
    const bg = img ? 'url(' + img + ') center / ' + (p.fit === 'contain' ? 'contain no-repeat #FFFFFF' : 'cover') : (p.swatch || '');
    const label = (p.title || '') + (p.value ? ': ' + p.value : '');
    const cta = p.cta || (sel ? 'Změnit' : 'Vybrat');
    const open = () => { if (p.onOpen) p.onOpen(); };
    const can = p.canChange === undefined ? true : yes(p.canChange);
    return {
      rowId: p.rowId || undefined,
      warnStr: yes(p.warn) ? 'true' : 'false',
      pos: p.position || '',
      selected: sel, notSelected: !sel,
      hasThumb: sel && !!bg,
      hasPh: sel && !bg, /* 18. 11. 2026: položka bez fotky – placeholder miniatury */
      thumbStyle: { background: bg },
      title: p.title || '', value: p.value || '',
      showNote: sel && !!p.note, note: p.note || '',
      noteStyle: { color: p.noteColor || 'var(--ss-text-primary,#1C2229)' },
      ctaLabel: cta, ctaPri: cta === 'Vybrat' ? 'true' : 'false',
      aria: label + (sel ? ', ' + cta.toLowerCase() : ', vybrat'),
      open,
      hasZoom: sel && !!img,
      zoomAria: 'Zvětšit fotku: ' + (p.value || p.title || ''),
      zoom: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState({ zoom: true }); },
      zoomOpen: !!this.state.zoom,
      zoomTitle: label,
      zoomData: { image: img, label },
      closeZoom: () => this.setState({ zoom: false }),
      zoomPrimary: can ? 'Změnit výběr' : '',
      zoomChange: can ? (() => { this.setState({ zoom: false }); open(); }) : undefined
    };
  }
}
</script>
</body>
</html>
