html[data-mode="dark"] .ss-ct:hover,html[data-mode="dark"] .ss-cat:hover,html[data-mode="dark"] .ss-art:hover,html[data-mode="dark"] .ss-mm-ban:hover,html[data-mode="dark"] .ss-pc:hover,html[data-mode="dark"] .ss-hp-tile:hover{box-shadow:none!important;}
/* Produktová karta: v tmavém režimu bez podkladu, tmavá modrá jen na hover; karty blíž k sobě */
html[data-mode="dark"] .ss-pc{background:transparent;padding:18px;transition:background-color .15s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){html[data-mode="dark"] .ss-pc:hover{background:#0E1F2F;}}
html[data-mode="dark"] .ss-car{gap:8px;}

/* Hover obtažení: 1px gradientní linka, světle modré světlo z levého horního rohu */
html[data-mode="dark"] .ss-pc::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:radial-gradient(ellipse 90% 70% at 0% 0%,rgba(141,179,211,.95) 0%,rgba(141,179,211,.45) 35%,rgba(141,179,211,.16) 65%,rgba(141,179,211,.06) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:0;transition:opacity .15s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){html[data-mode="dark"] .ss-pc:hover::before{opacity:1;}}
html[data-mode="dark"] .ss-pm-card:hover .ss-pm-title,html[data-mode="dark"] .ss-pm-row:hover .ss-pm-title,html[data-mode="dark"] .ss-pc:hover .ss-pc-title,html[data-mode="dark"] .ss-mm-ban:hover{color:#FBB255!important;}

/* Podklad webu: jemný radiální gradient ze středu viewportu (hloubka). Fixní → plynule přes všechny sekce. */
/* Vinětace (Elevace) odebrána 12. 10. 2026 – plné podklady, stíny karet zůstávají vždy */


/* Gradient Zap: elevace všech ploch, které by na gradientu splývaly (karty, filtry, video, boxy). Gradient Vyp = beze změny. */

@media (hover:hover) and (pointer:fine){
html a.ss-elev:hover,html button.ss-elev:hover,html .ss-ct:not([data-pop="true"]):hover,html .ss-cat:hover,html .ss-hp-tile:hover,html .ss-pd-row:hover{box-shadow:0 4px 12px rgba(19,44,67,.12)!important;}

}

/* Úvodní sekce s gradientem (Kategorie): surface.page nahoře → surface.muted dole; vrství se pod vinětaci */

/* Nadpisy: světlý režim tmavá modrá z hlavičky #0B1F33 (inline barva vyhrává – bílé nadpisy na tmavých pásech zůstávají) */
h1,h2,h3,h4{color:var(--ss-text-heading,#0B1F33);}

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1600}}">
class Component extends DCLogic {
  state = {
    width: typeof window !== 'undefined' ? document.documentElement.clientWidth : 1440,
    led: true,
    f: { name: '', email: '', prefix: '+420', phone: '', company: false, ico: '', dic: '', firm: '', street: '', city: '', zip: '', other: false, dName: '', dStreet: '', dCity: '', dZip: '', note: false, noteText: '' },
    optSurvey: false, optNews: false, terms: false
  };
  componentDidMount() {
    this._r = () => this.setState({ width: document.documentElement.clientWidth });
    window.addEventListener('resize', this._r);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  fmt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0') + '\u00A0Kč'; }
  set(k, v) { this.setState(s => ({ f: Object.assign({}, s.f, { [k]: v }) })); }
  renderVals() {
    const w = this.state.width;
    const narrow = w < 820, wide = w >= 1000;
    const pad = narrow ? '16px' : '32px';
    const goods = [
      { title: 'Manželská postel SANTE 45 dvoulůžko', variant: '200 × 180 cm · olej Teak · jádrový buk', qty: 2, unit: 19990, img: '_blob/6721a0d378d224249b73f0d946656a32.jpg' },
      { title: 'Matrace Spring Variant 22 cm', variant: '180 × 200 cm · tuhost H3', qty: 1, unit: 7590, img: '_blob/66ef2119f31d8262ba38ce4bea618a8e.webp' }
    ];
    const delFee = 1500;
    const total = goods.reduce((s, g) => s + g.unit * g.qty, 0) + delFee;
    const on = {};
    Object.keys(this.state.f).forEach(k => { on[k] = (v) => this.set(k, v); });
    on.noteText = (e) => this.set('noteText', e.target.value);
    return {
      ledMode: this.state.led ? 'on' : 'off',
      presItems: [{ label: 'LED', value: this.state.led }],
      onPresToggle: () => this.setState(s => ({ led: !s.led })),
      inner: { maxWidth: '1560px', margin: '0 auto', boxSizing: 'border-box', padding: (narrow ? '32px ' : '48px ') + pad + (narrow ? ' 48px' : ' 80px') },
      innerFoot: { maxWidth: '1560px', margin: '0 auto', boxSizing: 'border-box', padding: '16px ' + pad, display: 'flex', justifyContent: 'center' },
      cols: wide ? 'minmax(0,1fr) minmax(360px,440px)' : 'minmax(0,1fr)',
      colGap: wide ? '64px' : '48px',
      asideWrap: wide ? { minWidth: 0, paddingLeft: '48px', borderLeft: '1px solid var(--ss-border-subtle,#E1E6EB)', alignSelf: 'stretch' } : { minWidth: 0 },
      h2Size: narrow ? '24px' : '28px',
      h3Size: narrow ? '20px' : '22px',
      cityCols: w >= 550 ? 'minmax(0,1fr) 160px' : 'minmax(0,1fr)',
      f: this.state.f, on,
      prefixes: [{ value: '+420', label: 'CZ +420' }, { value: '+421', label: 'SK +421' }],
      dicInfo: ['Vyplňte, jen pokud je firma plátcem DPH', 'Formát: kód země a číslo, např. CZ12345678', 'Fakturu vystavíme s DIČ automaticky'],
      items: goods.map(g => ({ title: g.title, variant: g.variant, qty: g.qty, img: g.img, total: this.fmt(g.unit * g.qty) })),
      lines: [
        { label: 'Doprava', name: 'Vlastní doprava s vynáškou do patra', value: this.fmt(delFee) },
        { label: 'Platba', name: 'Platba kartou online', value: 'Zdarma' }
      ],
      checks: [
        { label: 'Nezasílat dotazník spokojenosti v rámci programu Ověřeno zákazníky', checked: this.state.optSurvey },
        { label: 'Nepřeji si dostávat exkluzivní slevy a tipy e-mailem', checked: this.state.optNews }
      ],
      terms: this.state.terms,
      onTerms: (v) => this.setState({ terms: v }),
      onCheck: (i, v) => this.setState(i === 0 ? { optSurvey: v } : { optNews: v }),
      total: this.fmt(total),
      totalNoVat: this.fmt(total / 1.21)
    };
  }
}
</script>
</body>
</html>
