/* Karty: v tmavém režimu bez hover podkladu a stínu, mění se jen barva nadpisu */
html[data-mode="dark"] .ss-ct:hover,html[data-mode="dark"] .ss-cat:hover,html[data-mode="dark"] .ss-art:hover,html[data-mode="dark"] .ss-mm-ban:hover,html[data-mode="dark"] .ss-pc:hover,html[data-mode="dark"] .ss-hp-tile:hover{box-shadow:none!important;}
/* Produktová karta: v tmavém režimu bez podkladu, tmavá modrá jen na hover; karty blíž k sobě */
html[data-mode="dark"] .ss-pc{background:transparent;padding:18px;transition:background-color .15s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){html[data-mode="dark"] .ss-pc:hover{background:#0E1F2F;}}
html[data-mode="dark"] .ss-car{gap:8px;}

/* Hover obtažení: 1px gradientní linka, světle modré světlo z levého horního rohu */
html[data-mode="dark"] .ss-pc::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:radial-gradient(ellipse 90% 70% at 0% 0%,rgba(141,179,211,.95) 0%,rgba(141,179,211,.45) 35%,rgba(141,179,211,.16) 65%,rgba(141,179,211,.06) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:0;transition:opacity .15s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){html[data-mode="dark"] .ss-pc:hover::before{opacity:1;}}
html[data-mode="dark"] .ss-pm-card:hover .ss-pm-title,html[data-mode="dark"] .ss-pm-row:hover .ss-pm-title,html[data-mode="dark"] .ss-pc:hover .ss-pc-title,html[data-mode="dark"] .ss-mm-ban:hover{color:#FBB255!important;}

/* Podklad webu: jemný radiální gradient ze středu viewportu (hloubka). Fixní → plynule přes všechny sekce. */
/* Vinětace (Elevace) odebrána 12. 10. 2026 — plné podklady, stíny karet zůstávají vždy */


/* Gradient Zap: elevace všech ploch, které by na gradientu splývaly (karty, filtry, video, boxy). Gradient Vyp = beze změny. */

@media (hover:hover) and (pointer:fine){
html a.ss-elev:hover,html button.ss-elev:hover,html .ss-ct:not([data-pop="true"]):hover,html .ss-cat:hover,html .ss-hp-tile:hover,html .ss-pd-row:hover{box-shadow:0 4px 12px rgba(19,44,67,.12)!important;}

}

/* Úvodní sekce s gradientem (Kategorie): surface.page nahoře → surface.muted dole; vrství se pod vinětaci */

/* Nadpisy: světlý režim tmavá modrá z hlavičky #0B1F33 (inline barva vyhrává — bílé nadpisy na tmavých pásech zůstávají) */
h1,h2,h3,h4{color:var(--ss-text-heading,#0B1F33);}

<style>

<div style="width:100%;background:var(--ss-surface-page,#FFFFFF);font-family:Roboto,Helvetica,Arial,sans-serif;color:var(--ss-text-primary,#1C2229)">
  <dc-import name="Hlavicka" style="position:sticky;top:0;z-index:200" ledMode="{{ ledMode }}" hint-size="100%,180px"></dc-import>
  <dc-import name="PrezentacniLista" items="{{ presItems }}" onToggle="{{ onPresToggle }}" hint-size="320px,52px"></dc-import>

  <main>
    <section class="ss-grad-top" style="width:100%;background-color:var(--ss-surface-page,#FFFFFF)">
      <div style="{{ innerTop }}">
        <h1 style="margin:0 0 8px;font-size:{{ h1Size }};line-height:1.1">Výsledky pro „postele“ (126)</h1>
        <p style="margin:0;font-size:15px;color:var(--ss-text-secondary,#3D4750)">Pro upřesnění výsledků použijte filtr.</p>

        <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:24px">
          <button type="button" class="ss-seg" aria-pressed="{{ tabCatPressed }}" onClick="{{ pickCat }}">Kategorie (8)</button>
          <button type="button" class="ss-seg" aria-pressed="{{ tabArtPressed }}" onClick="{{ pickArt }}">Články (10)</button>
        </div>
      </div>
    </section>

    <section style="width:100%;background:var(--ss-surface-page,#FFFFFF)">
      <div style="{{ innerTabBody }}">

        <sc-if value="{{ isCat }}" hint-placeholder-val="{{ true }}">
          <div style="margin-top:20px">
            <h2 style="margin:0 0 12px;font-size:13px;letter-spacing:.1em;color:var(--ss-text-muted,#55616C)">Kategorie</h2>
            <div style="display:grid;grid-template-columns:{{ catTemplate }};gap:12px">
              <sc-for list="{{ categories }}" as="c" hint-placeholder-count="8">
                <a class="ss-cat" href="{{ c.href }}">
                  <span class="ss-ph" style="flex:none;width:40px;height:40px;border-radius:6px"><dc-import name="Ikony" iconName="photo" size="20" hint-size="20px,20px"></dc-import></span>
                  <span style="display:flex;flex-direction:column;gap:2px;min-width:0">
                    <span style="font-size:15px;font-weight:600;line-height:1.3;color:var(--ss-link-hover,#21507B)">{{ c.label }}</span>
                    <span style="font-size:13px;color:var(--ss-text-muted,#5B6874)">{{ c.countText }}</span>
                  </span>
                </a>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ isArt }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:20px">
            <h2 style="margin:0 0 12px;font-size:13px;letter-spacing:.1em;color:var(--ss-text-muted,#55616C)">Články</h2>
            <div style="display:grid;grid-template-columns:{{ artTemplate }};gap:20px">
              <sc-for list="{{ articles }}" as="a" hint-placeholder-count="4">
                <a class="ss-art" href="{{ a.href }}">
                  <span class="ss-ph" style="height:180px"><dc-import name="Ikony" iconName="photo" size="28" hint-size="28px,28px"></dc-import></span>
                  <span class="ss-art-t" style="font-family:Oswald,Roboto,sans-serif;font-weight:700;font-size:19px;line-height:1.25;transition:color .12s cubic-bezier(.22,.61,.36,1)">{{ a.title }}</span>
                  <span style="font-size:14px;line-height:1.55;color:var(--ss-text-secondary,#3D4750)">{{ a.perex }}</span>
                </a>
              </sc-for>
            </div>
          </div>
        </sc-if>
      </div>
    </section>

    <section style="width:100%;background:var(--ss-surface-page,#FFFFFF)">
      <div style="{{ innerResults }}">
        <div style="display:grid;grid-template-columns:{{ resultsTemplate }};gap:{{ resultsGap }};align-items:start">

          <sc-if value="{{ hasSidebar }}" hint-placeholder-val="{{ true }}">
            <dc-import name="FiltrPanel" selected="{{ selected }}" onToggleOption="{{ onToggleOption }}" priceFrom="{{ priceFrom }}" priceTo="{{ priceTo }}" onPriceChange="{{ onPrice }}" onClearAll="{{ onClearAll }}" hint-size="300px,720px"></dc-import>
          </sc-if>

          <div style="min-width:0;display:flex;flex-direction:column;gap:20px">
            <sc-if value="{{ hasSidebar }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;flex-wrap:wrap;align-items:center;gap:0 24px;border-bottom:1px solid var(--ss-border-subtle,#E1E6EB)">
                <sc-for list="{{ sorts }}" as="s" hint-placeholder-count="6">
                  <button type="button" class="ss-sort" aria-pressed="{{ s.pressed }}" onClick="{{ s.onPick }}">{{ s.label }}</button>
                </sc-for>
                <span style="margin-left:auto;font-size:13px;font-weight:600;color:var(--ss-text-secondary,#3D4750);white-space:nowrap">{{ totalText }}</span>
              </div>
            </sc-if>
            <sc-if value="{{ noSidebar }}" hint-placeholder-val="{{ false }}">
              <dc-import name="FiltracniLista" total="{{ total }}" sort="{{ sort }}" sortOptions="{{ sortOptions }}" onSort="{{ onSort }}" inStockOnly="{{ inStockOnly }}" onToggleInStock="{{ onToggleStock }}" onOpenFilters="{{ openFilters }}" hint-size="100%,72px"></dc-import>
            </sc-if>

            <h2 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0">Produkty</h2>
            <div class="ss-pgrid" style="display:grid;grid-template-columns:{{ productTemplate }};gap:20px">
              <sc-for list="{{ products }}" as="p" hint-placeholder-count="9">
                <dc-import name="ProduktovaKarta" product="{{ p.data }}" onFavourite="{{ p.onFav }}" hint-size="100%,560px"></dc-import>
              </sc-for>
            </div>

            <dc-import name="Paginace" page="{{ page }}" totalPages="{{ 6 }}" perPage="{{ 24 }}" totalItems="{{ total }}" onPage="{{ onPage }}" onLoadMore="{{ onLoadMore }}" hint-size="100%,160px"></dc-import>
          </div>
        </div>
      </div>
    </section>
  </main>

  <dc-import name="FiltrDrawer" open="{{ filtersOpen }}" resultCount="{{ total }}" selected="{{ selected }}" onToggleOption="{{ onToggleOption }}" onClearAll="{{ onClearAll }}" onClose="{{ closeFilters }}" priceFrom="{{ priceFrom }}" priceTo="{{ priceTo }}" onPriceChange="{{ onPrice }}" hint-size="0,0"></dc-import>
  <dc-import name="Paticka" ledMode="{{ ledMode }}" hint-size="100%,700px"></dc-import>
</div>
