.ss-pm-tip{max-width:min(240px,100%);}

<div class="pm-root" data-l="{{ layoutName }}" data-lg="{{ lgStr }}" style="display:grid;grid-template-columns:{{ rootCols }};gap:{{ rootGap }};column-gap:{{ colGap }};align-items:start;width:100%;min-width:0;font-family:Roboto,Helvetica,Arial,sans-serif;color:var(--ss-text-secondary,#3D4750)">
  <sc-if value="{{ plainTuhost }}" hint-placeholder-val="{{ false }}">
    <span style="display:flex;flex-direction:column;gap:8px;width:100%">
      <span style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;font-family:{{ lblFont }};font-size:{{ lblSize }};line-height:1.35">
        <span style="flex:none;white-space:nowrap">{{ tuhostTitle }}</span>
        <span style="flex:none;white-space:nowrap;font-weight:600;color:var(--ss-text-primary,#1C2229)">{{ tuhostLabel }}</span>
      </span>
      <span aria-hidden="true" style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;width:100%;padding:4px 0">
        <sc-for list="{{ tSegs }}" as="ts" hint-placeholder-count="5"><span style="display:block;height:4px;border-radius:2px;background:{{ ts.bg }}"></span></sc-for>
      </span>
    </span>
  </sc-if>
  <!-- Varianta C (seg) smazána 30. 10. 2026 na pokyn klienta -->
  <sc-if value="{{ radaL }}" hint-placeholder-val="{{ false }}">
    <div style="grid-column:1/-1;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <div class="pm-rule"><span>{{ tuhostTitle }}</span><span style="display:inline-flex;align-items:baseline;gap:6px"><span style="color:var(--ss-text-muted,#5B6874)">{{ tWord }}</span><strong style="font-size:17px">{{ tNum }}/5</strong></span></div>
        <div role="img" aria-label="{{ tAria }}" style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px">
          <span class="pm-in {{ rd.c1 }}" style="display:flex;justify-content:center;padding:2px 0;opacity:{{ rd.o1 }};animation-delay:0ms"><svg width="40" height="32" viewBox="0 4 32 26" aria-hidden="true" style="overflow:visible"><path class="{{ rd.pd1 }}" d="M3 18H5C10.5 18 11 25 16 25C21 25 21.5 18 27 18H29" fill="none" stroke="{{ rd.s1 }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle class="{{ rd.pb1 }}" cx="16" cy="19.5" r="4.5" fill="{{ rd.f1 }}"></circle></svg></span>
          <span class="pm-in {{ rd.c2 }}" style="display:flex;justify-content:center;padding:2px 0;opacity:{{ rd.o2 }};animation-delay:60ms"><svg width="40" height="32" viewBox="0 4 32 26" aria-hidden="true" style="overflow:visible"><path class="{{ rd.pd2 }}" d="M3 18H6C11 18 11 23.2 16 23.2C21 23.2 21 18 26 18H29" fill="none" stroke="{{ rd.s2 }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle class="{{ rd.pb2 }}" cx="16" cy="17.7" r="4.5" fill="{{ rd.f2 }}"></circle></svg></span>
          <span class="pm-in {{ rd.c3 }}" style="display:flex;justify-content:center;padding:2px 0;opacity:{{ rd.o3 }};animation-delay:120ms"><svg width="40" height="32" viewBox="0 4 32 26" aria-hidden="true" style="overflow:visible"><path class="{{ rd.pd3 }}" d="M3 18H7C11.5 18 11 21.6 16 21.6C21 21.6 20.5 18 25 18H29" fill="none" stroke="{{ rd.s3 }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle class="{{ rd.pb3 }}" cx="16" cy="16.1" r="4.5" fill="{{ rd.f3 }}"></circle></svg></span>
          <span class="pm-in {{ rd.c4 }}" style="display:flex;justify-content:center;padding:2px 0;opacity:{{ rd.o4 }};animation-delay:180ms"><svg width="40" height="32" viewBox="0 4 32 26" aria-hidden="true" style="overflow:visible"><path class="{{ rd.pd4 }}" d="M3 18H8C12 18 11 20 16 20C21 20 20 18 24 18H29" fill="none" stroke="{{ rd.s4 }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle class="{{ rd.pb4 }}" cx="16" cy="14.5" r="4.5" fill="{{ rd.f4 }}"></circle></svg></span>
          <span class="pm-in {{ rd.c5 }}" style="display:flex;justify-content:center;padding:2px 0;opacity:{{ rd.o5 }};animation-delay:240ms"><svg width="40" height="32" viewBox="0 4 32 26" aria-hidden="true" style="overflow:visible"><path class="{{ rd.pd5 }}" d="M3 18H9C12.5 18 11 18.6 16 18.6C21 18.6 19.5 18 23 18H29" fill="none" stroke="{{ rd.s5 }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle class="{{ rd.pb5 }}" cx="16" cy="13.1" r="4.5" fill="{{ rd.f5 }}"></circle></svg></span>
        </div>
        <div class="pm-sub" aria-hidden="true"><span>měkká</span><span>tvrdá</span></div>
      </div>
      <!-- D: Ideální pro (váha) převzato z varianty A – ukazatel rozsahu pod blokem (30. 10. 2026) -->
    </div>
  </sc-if>
  <sc-if value="{{ kompaktL }}" hint-placeholder-val="{{ false }}">
    <dl style="grid-column:1/-1;margin:0;display:flex;flex-direction:column;padding:0"><!-- E: bez podkladu a odsazení (30. 10. 2026) -->
      <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:10px;min-height:44px;border-bottom:{{ kBorder }}">
        <!-- E: ikony (kulička, váha) odebrány, Oswald; sloupečky tuhosti uprostřed řádku (30. 10. 2026) -->
        <dt style="min-width:0;font-family:Oswald,Roboto,sans-serif;font-size:15px;color:var(--ss-text-secondary,#3D4750)">{{ tuhostTitle }}</dt>
        <dd style="margin:0;display:contents">
          <span role="img" aria-label="{{ tAria }}" style="display:flex;align-items:flex-end;gap:3px;height:16px">
            <sc-for list="{{ kbars }}" as="kb" hint-placeholder-count="5">
              <span style="position:relative;width:6px;height:{{ kb.h }};border-radius:2px;background:var(--ss-surface-strong,#E9E1D5);overflow:hidden"><span class="pm-bar" style="position:absolute;left:0;right:0;bottom:0;height:{{ kb.f }};background:#296093;animation-delay:{{ kb.d }}"></span></span>
            </sc-for>
          </span>
          <strong style="font-family:Oswald,Roboto,sans-serif;font-size:17px;font-weight:600;min-width:28px;text-align:right;justify-self:end;color:var(--ss-text-primary,#1C2229)">{{ tNum }}</strong>
        </dd>
      </div>
      <sc-if value="{{ hasZatizeni }}" hint-placeholder-val="{{ true }}">
        <!-- E: rozsah zatížení jako ukazatel z varianty A uprostřed řádku, tloušťka 6 px jako sloupečky tuhosti (30. 10. 2026) -->
        <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:10px;min-height:44px">
          <dt style="min-width:0;font-family:Oswald,Roboto,sans-serif;font-size:15px;color:var(--ss-text-secondary,#3D4750)">{{ idealLabel }}</dt>

      rd['mc' + j] = on ? 'pm-on' : ''; rd['mo' + j] = on ? 1 : 0.35; rd['ms' + j] = on ? '#2E3F7F' : '#5B6874';
      rd['mw' + j] = on ? 600 : 400; rd['ml' + j] = j === 4 ? '130+' : String(w);
    });
    const facts = [];
    if (p.vyska) facts.push({ icon: 'arrow-autofit-height', label: p.vyska + nb + 'cm', tip: 'Celková výška matrace včetně potahu' + (p.vyskaJadra ? ', jádro ' + p.vyskaJadra + nb + 'cm.' : '.') });
    if (p.nosnostMax) facts.push({ icon: 'weight', label: 'max' + nb + p.nosnostMax + nb + 'kg', tip: 'Maximální nosnost na jednu osobu.' });
    if (p.zaruka) facts.push({ icon: 'shield-check', label: p.zaruka + nb + (p.zaruka === 1 ? 'rok' : p.zaruka < 5 ? 'roky' : 'let'), tip: 'Délka záruky na matraci.' });
    facts.forEach((f, i) => { f.id = u + 'f' + i; });
    return {
      idT: u + 't', idZ: u + 'z',
      rootGap: lg ? '20px' : '12px',
      lblSmall: lg ? '15px' : '13px',
      large: lg, tuhostTitle: p.tuhostTitle || 'Tuhost',
      // Popisky ukazatelů (Tuhost + číslo, Ideální pro + váha) na kartě Oswaldem (30. 10. 2026, zkouška); Oswald je úzký → 15 px
      lblFont: lg ? 'Roboto,Helvetica,Arial,sans-serif' : 'Oswald,Roboto,sans-serif',
      lblSize: '15px', lblWeight: lg ? 700 : 400, lblColor: lg ? 'var(--ss-text-primary,#1C2229)' : 'inherit', valSize: lg ? '17px' : '15px',
      knob: k, knobHalf: k / 2, track: tr, trackTop: (k - tr) / 2,
      hasTuhost: t !== null,
      plainTuhost: t !== null && !!p.plain && isBars, btnTuhost: t !== null && !p.plain && isBars,
      tuhostLabel: t === null ? '' : String(t).replace('.', ',') + ' z 5',
      tuhostPos: t === null ? 0 : t * 20, // poloha podle celého stupně, aby odpovídala číslu
      // A / A2: dílky tuhosti 1–5, odstíny od světlé po tmavou (stejná škála jako komponenta Tuhost)
      tSegs: ['#B9D0E5', '#8DB3D3', '#296093', '#21507B', '#132C43'].map((c, i) => ({ bg: t !== null && i < t ? c : emptyBg })),
      emptyBg,
      hasZatizeni: hasZ,
      zatizeniLabel: hasZ ? od + '–' + dd + nb + 'kg' : '',
      odPos: hasZ ? clamp(od / max * 100) : 0,
      doPos: hasZ ? clamp(dd / max * 100) : 0,
      rangeW: hasZ ? clamp((dd - od) / max * 100) : 0,
      scaleLabel: max + nb + 'kg',
      idealLabel: 'Ideální pro váhu',
      tiles: p.layout === 'tiles',
      // C = segmenty + pravítko, D = řada profilů a postav, E = kompaktní řádky (bez táhel)
      radaL: t !== null && p.layout === 'rada', kompaktL: t !== null && p.layout === 'kompakt',
      tWord: tWordCap, tNum: tNumStr, tAria: 'Tuhost ' + tNumStr + ' z 5, ' + tWordLow,
      segs: [1, 2, 3, 4, 5].map((i) => ({ w: Math.round(Math.max(0, Math.min(1, (t || 0) - (i - 1))) * 100) + '%', d: (i - 1) * 90 + 'ms' })),
      kbars: [1, 2, 3, 4, 5].map((i) => ({ h: (6 + i * 2) + 'px', f: Math.round(Math.max(0, Math.min(1, (t || 0) - (i - 1))) * 100) + '%', d: (i - 1) * 70 + 'ms' })),
      ticks: ticks, scaleMid: Math.round(max / 2),
      kIcon: Component.PROFILES[tLvl], kBorder: hasZ ? '1px solid var(--ss-surface-strong,#E9E1D5)' : '0',
      rd: rd,
      // Varianta A2 (bars2): tuhost a „Ideální pro váhu“ ve dvou sloupcích vedle sebe; popisek a hodnota se v úzkém sloupci zalomí pod sebe
      rootCols: p.layout === 'bars2' ? 'minmax(0,1fr) minmax(0,1fr)' : 'minmax(0,1fr)',
      colGap: p.layout === 'bars2' ? '8px' : (lg ? '20px' : '12px'),
      lblWrap: p.layout === 'bars2' ? 'wrap' : 'nowrap',
      // A2: stupnice 1–5 pod tuhostí a podbarvené buňky jako dlaždice ve variantě B
      // A2: stupnice 1–5 i 0–130 kg pod ukazateli odebrány kvůli nižší kartě (30. 10. 2026)
      scaleT: false,
      layoutName: p.layout || 'bars', lgStr: lg ? 'true' : 'false',
      scaleZ: p.layout !== 'bars2' || lg,
      cellBg: p.layout === 'bars2' ? 'var(--ss-surface-subtle,#FAF5EF)' : 'none',
      cellPad: p.layout === 'bars2' ? '10px 12px' : '0',
      cellRad: p.layout === 'bars2' ? '8px' : '6px',
      barZatizeni: hasZ && (isBars || p.layout === 'rada'),
      tLevelTag: 'H' + tLvl,
      tIcon: Component.tuhostSvg(Component.TUHOST_ICONS[tLvl], tAnim),
      hasTIcon: !!Component.TUHOST_ICONS[tLvl], noTIcon: !Component.TUHOST_ICONS[tLvl],
      tipZ: 'Doporučená váha jednoho spáče' + (hasZ ? ' (' + od + '–' + dd + nb + 'kg).' : '.'),
      facts
    };
  }
}
</script>
