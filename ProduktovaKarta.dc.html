/* Tmavý režim – přepíná html[data-mode="dark"]. Světlý režim = fallback hodnoty v var(). */
/* Hover ve světlém režimu modrý (6. 10. 2026), v tmavém meruňkový */
html:not([data-mode="dark"]){--ss-hover-text:#21507B;--ss-hover-bg:#F0F5FA;
  /* Teplé meruňkové podklady (7. 10. 2026) */
  --ss-surface-page:#FFFFFF;--ss-surface-subtle:#FAF5EF;--ss-surface-muted:#F3EDE4;--ss-surface-strong:#E9E1D5;--ss-surface-card:#FFFFFF;--ss-surface-box:#FFFFFF;--ss-text-heading:#0B1F33;
  /* Sekundární tlačítko tonální meruňkové (7. 10. 2026) */
  --ss-action-tonal-bg:#FEEDD4;--ss-action-tonal-hover-bg:#FDDCAA;--ss-action-tonal-fg:#7A4708;--ss-action-tonal-hover-fg:#7A4708;}
html:not([data-mode="dark"]),html:not([data-mode="dark"]) body{background:#FFFFFF;}
html[data-mode="dark"]{color-scheme:dark;
  --ss-surface-tint:rgba(251,178,85,.04);
  --ss-pm-range:linear-gradient(90deg,#4F82B0 0%,#8DB3D3 100%);
  --ss-border-accent-subtle:#5A4425;
  --ss-border-action:#8DB3D3;
  --ss-action-tonal-bg:rgba(141,179,211,.16);
  --ss-action-tonal-hover-bg:rgba(141,179,211,.26);
  --ss-action-tonal-fg:#B9D0E5;
  --ss-action-tonal-hover-fg:#FBB255;
  --ss-border-action-hover:#B9D0E5;
  --ss-border-error:#F4A39C;
  --ss-border-error-subtle:#7A3A35;
  --ss-border-faint:#1E3850;
  --ss-border-hover:#5B8FBC;
  --ss-border-strong:#3A5A7A;
  --ss-border-subtle:#24405B;
  --ss-border-success-subtle:#2C5A40;
  --ss-link:#8DB3D3;
  --ss-link-hover:#B9D0E5;
  --ss-usp-from-c:#8DB3D3;
  --ss-usp-to-c:#FBB255;
  --ss-text-apricot:#FBB255;
  --ss-usp-title:#FBB255;
  --ss-hover-text:#FBB255;
  --ss-hover-bg:rgba(251,178,85,.12);
  --ss-status-error:#F4A39C;
  --ss-status-error-strong:#F4B6B1;
  --ss-status-error-surface:#3A1A18;
  --ss-status-success:#71CC92;
  --ss-status-success-strong:#A8E1BB;
  --ss-status-success-surface:#12301F;
  --ss-status-success-chip:#12301F;
  --ss-status-success-chip-fg:#A8E1BB;
  --ss-status-warning:#FCC77D;
  --ss-surface-accent:#2B2318;
  --ss-surface-accent-strong:#3A2C17;
  --ss-surface-hover:#1A3A58;
  --ss-surface-muted:#183049;
  --ss-surface-page:#0E1F2F;
  --ss-surface-card:#0E1F2F;
  --ss-surface-box:#13283C;
  --ss-surface-selected:#1F4669;
  --ss-surface-strong:#22405C;
  --ss-surface-subtle:#13283C;
  --ss-text-decor:#4A6683;
  --ss-text-disabled:#7F94A8;
  --ss-text-muted:#9DB0C2;
  --ss-text-primary:#EEF3F8;
  --ss-text-heading:#EEF3F8;
  --ss-text-secondary:#C5D2DE;
}
html[data-mode="dark"],html[data-mode="dark"] body{background:#0E1F2F;}
html[data-mode="dark"] .ss-hd-logo-pos{display:none!important;}
html[data-mode="dark"] .ss-hd-logo-neg{display:block!important;}
html[data-mode="dark"][data-logo="a"] .ss-hd-logo-neg,html[data-mode="dark"][data-logo="b"] .ss-hd-logo-neg,html[data-mode="dark"][data-logo="c"] .ss-hd-logo-neg,html[data-mode="dark"][data-logo="d"] .ss-hd-logo-neg{display:none!important;}
html[data-mode="dark"][data-logo="a"] .ss-hd-logo-a,html[data-mode="dark"][data-logo="b"] .ss-hd-logo-b,html[data-mode="dark"][data-logo="c"] .ss-hd-logo-c,html[data-mode="dark"][data-logo="d"] .ss-hd-logo-d{display:block!important;}
html[data-mode="dark"] img{filter:none;}

/* Oddělení hlavičky a overlay panelů v tmavém režimu */
html[data-mode="dark"] .ss-hd{box-shadow:0 1px 0 rgba(141,179,211,.18),0 8px 24px rgba(0,0,0,.45)!important;}
/* Hlavička: horní lišta a hlavní řádek průsvitné s background blur, menu (.ss-hd-nav) zůstává plné */
html[data-mode="dark"] .ss-hd{background:transparent!important;}
html[data-mode="dark"] .ss-hd-topbar{background-color:rgba(19,40,60,.72)!important;-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);}
html[data-mode="dark"] .ss-hd-main{background-color:rgba(14,31,47,.72)!important;-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);}
html[data-mode="dark"] .ss-hd-topbar{border-bottom-color:transparent!important;}
html[data-mode="dark"] .ss-hd-nav{border-top-color:transparent!important;background-color:#13283C!important;background-image:linear-gradient(180deg,#13283C 0%,#102336 100%)!important;}
html[data-mode="dark"] .ss-mm{background:#13283C!important;box-shadow:inset 0 1px 0 rgba(141,179,211,.18),0 0 0 1px rgba(141,179,211,.14),0 24px 48px rgba(0,0,0,.6)!important;}
html[data-mode="dark"] .ss-hd .ss-pm{background:#13283C!important;box-shadow:inset 0 1px 0 rgba(141,179,211,.18),0 0 0 1px rgba(141,179,211,.14),0 24px 48px rgba(0,0,0,.6)!important;}
html[data-mode="dark"] .ss-pm-card{background:#13283C;}
html[data-mode="dark"] .ss-pm-card:hover{background:#13283C!important;box-shadow:none!important;color:inherit!important;}
html[data-mode="dark"] .ss-pm-row:hover{background:transparent!important;box-shadow:none!important;color:inherit!important;}

/* Ostrůvek světlého režimu (popupy nad fotkami – produktové fotky mají bílé pozadí) */
html[data-mode="dark"] .ss-light{color-scheme:light;
  --ss-hover-text:#21507B;
  --ss-hover-bg:#F0F5FA;
  --ss-text-apricot:initial;
  --ss-usp-title:initial;
  --ss-border-accent-subtle:initial;
  --ss-border-action:initial;
  --ss-action-tonal-bg:initial;
  --ss-action-tonal-hover-bg:initial;
  --ss-action-tonal-fg:initial;
  --ss-border-action-hover:initial;
  --ss-border-error:initial;
  --ss-border-error-subtle:initial;
  --ss-border-faint:initial;
  --ss-border-hover:initial;
  --ss-border-strong:initial;
  --ss-border-subtle:initial;
  --ss-border-success-subtle:initial;
  --ss-link:initial;
  --ss-link-hover:initial;
  --ss-status-error:initial;
  --ss-status-error-strong:initial;
  --ss-status-error-surface:initial;
  --ss-status-success:initial;
  --ss-status-success-strong:initial;
  --ss-status-success-surface:initial;
  --ss-status-warning:initial;
  --ss-surface-accent:initial;
  --ss-surface-accent-strong:initial;
  --ss-surface-hover:initial;
  --ss-surface-muted:initial;
  --ss-surface-page:initial;
  --ss-surface-selected:initial;
  --ss-surface-strong:initial;
  --ss-surface-subtle:initial;
  --ss-text-decor:initial;
  --ss-text-disabled:initial;
  --ss-text-muted:initial;
  --ss-text-primary:initial;
  --ss-text-secondary:initial;
}

/* Hlavička v tmavém režimu: bez dělicí linky nad menu */
html[data-mode="dark"] .ss-hd-nav{border-top-color:transparent!important;}
/* Karty: v tmavém režimu bez hover podkladu a stínu, mění se jen barva nadpisu */
html[data-mode="dark"] .ss-ct:hover,html[data-mode="dark"] .ss-cat:hover,html[data-mode="dark"] .ss-art:hover,html[data-mode="dark"] .ss-mm-ban:hover,html[data-mode="dark"] .ss-pc:hover,html[data-mode="dark"] .ss-hp-tile:hover{box-shadow:none!important;}
/* Produktová karta: v tmavém režimu bez podkladu, tmavá modrá jen na hover; karty blíž k sobě */
html[data-mode="dark"] .ss-pc{background:transparent;padding:18px;transition:background-color .15s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){html[data-mode="dark"] .ss-pc:hover{background:#0E1F2F;}}
html[data-mode="dark"] .ss-car{gap:8px;}
html[data-mode="dark"] .ss-pgrid{gap:4px!important;}
/* Hover obtažení: 1px gradientní linka, světle modré světlo z levého horního rohu */
html[data-mode="dark"] .ss-pc::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:radial-gradient(ellipse 90% 70% at 0% 0%,rgba(141,179,211,.95) 0%,rgba(141,179,211,.45) 35%,rgba(141,179,211,.16) 65%,rgba(141,179,211,.06) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:0;transition:opacity .15s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){html[data-mode="dark"] .ss-pc:hover::before{opacity:1;}}
html[data-mode="dark"] .ss-pm-card:hover .ss-pm-title,html[data-mode="dark"] .ss-pm-row:hover .ss-pm-title,html[data-mode="dark"] .ss-pc:hover .ss-pc-title,html[data-mode="dark"] .ss-mm-ban:hover{color:#FBB255!important;}

/* Podklad webu: jemný radiální gradient ze středu viewportu (hloubka). Fixní → plynule přes všechny sekce. */
/* Vinětace (Elevace) odebrána 12. 10. 2026 – plné podklady, stíny karet zůstávají vždy */


/* Gradient Zap: elevace všech ploch, které by na gradientu splývaly (karty, filtry, video, boxy). Gradient Vyp = beze změny. */
html .ss-elev,html .ss-ct:not([data-pop="true"]),html .ss-cat,html .ss-hp-tile,html .ss-pd-row,html .ss-mm-art{box-shadow:0 2px 8px rgba(19,44,67,.08)!important;}
html[data-mode="dark"] .ss-elev,html[data-mode="dark"] .ss-ct:not([data-pop="true"]),html[data-mode="dark"] .ss-cat,html[data-mode="dark"] .ss-hp-tile,html[data-mode="dark"] .ss-pd-row{box-shadow:inset 0 1px 0 rgba(141,179,211,.14),0 0 0 1px rgba(141,179,211,.10),0 2px 8px rgba(0,0,0,.35)!important;}
@media (hover:hover) and (pointer:fine){
html a.ss-elev:hover,html button.ss-elev:hover,html .ss-ct:not([data-pop="true"]):hover,html .ss-cat:hover,html .ss-hp-tile:hover,html .ss-pd-row:hover{box-shadow:0 4px 12px rgba(19,44,67,.12)!important;}
html[data-mode="dark"] a.ss-elev:hover,html[data-mode="dark"] button.ss-elev:hover,html[data-mode="dark"] .ss-ct:not([data-pop="true"]):hover,html[data-mode="dark"] .ss-cat:hover,html[data-mode="dark"] .ss-hp-tile:hover,html[data-mode="dark"] .ss-pd-row:hover{box-shadow:inset 0 1px 0 rgba(141,179,211,.18),0 0 0 1px rgba(141,179,211,.14),0 8px 24px rgba(0,0,0,.45)!important;}
}
html .ss-ct[data-pop="true"]::before{box-shadow:0 2px 8px rgba(19,44,67,.08);}
html[data-mode="dark"] .ss-ct[data-pop="true"]::before{box-shadow:inset 0 1px 0 rgba(141,179,211,.14),0 0 0 1px rgba(141,179,211,.10),0 2px 8px rgba(0,0,0,.35);}
@media (hover:hover) and (pointer:fine){html .ss-ct[data-pop="true"]:hover::before{box-shadow:0 4px 12px rgba(19,44,67,.12);}html[data-mode="dark"] .ss-ct[data-pop="true"]:hover::before{box-shadow:inset 0 1px 0 rgba(141,179,211,.18),0 0 0 1px rgba(141,179,211,.14),0 8px 24px rgba(0,0,0,.45);}}
html .ss-elev:focus-visible{box-shadow:0 0 0 3px rgba(41,96,147,.35)!important;}

/* Prezentační přepínač fontů – html[data-font-h|data-font-b]="alt" */
html[data-font-h="alt"] h1:not(.ss-plain),html[data-font-h="alt"] h2:not(.ss-plain),html[data-font-h="alt"] h3:not(.ss-plain),html[data-font-h="alt"] h4:not(.ss-plain),html[data-font-h="alt"] [style*="Oswald"]{font-family:'Barlow Condensed',Oswald,Helvetica,Arial,sans-serif!important;}
html[data-font-b="alt"] body,html[data-font-b="alt"] [style*="Roboto"]:not([style*="Archivo"]):not([style*="Oswald"]),html[data-font-b="alt"] input,html[data-font-b="alt"] button,html[data-font-b="alt"] select,html[data-font-b="alt"] textarea{font-family:'IBM Plex Sans Condensed',Roboto,Helvetica,Arial,sans-serif!important;}
html[data-mode="dark"] .ss-ct:hover .ss-ct-title,html[data-mode="dark"] .ss-hp-art:hover .ss-hp-art-t,html[data-mode="dark"] .ss-mag-lead:hover .ss-hp-art-t{color:#FBB255;}

/* Centrální scrim pro všechny modály a drawery (oba režimy): blur 16 px, diagonální závoj, teplé bodové světlo z levého horního rohu */
.ss-scrim{background:radial-gradient(ellipse 75% 65% at 0% 0%,rgba(251,178,85,.34) 0%,rgba(251,178,85,.12) 40%,rgba(251,178,85,0) 70%),radial-gradient(ellipse 70% 60% at 100% 100%,rgba(240,154,44,.36) 0%,rgba(240,154,44,.12) 40%,rgba(240,154,44,0) 70%),linear-gradient(135deg,rgba(9,18,27,.6) 0%,rgba(9,18,27,.74) 50%,rgba(6,12,18,.8) 100%);-webkit-backdrop-filter:blur(16px) saturate(.9);backdrop-filter:blur(16px) saturate(.9);}
/* Vyhledávání v hlavičce: teplé bodové světlo na podkladu pole (tmavý režim) */
html[data-mode="dark"] .ss-hd .ss-input{background-image:radial-gradient(ellipse 45% 140% at 0% 0%,rgba(251,178,85,.20) 0%,rgba(251,178,85,.07) 45%,rgba(251,178,85,0) 75%)!important;}
html[data-mode="dark"] .ss-hd .ss-input:focus{background-image:radial-gradient(ellipse 55% 160% at 0% 0%,rgba(251,178,85,.28) 0%,rgba(251,178,85,.10) 45%,rgba(251,178,85,0) 80%)!important;}

html[data-mode="dark"] .ss-hd-tab[aria-current="page"]{color:#FBB255;}

/* Filtrační panel: světlý bílý (surface.card), tmavý zůstává surface.subtle */
html[data-mode="dark"] .ss-filtr{background:var(--ss-surface-subtle,#13283C)!important;}

/* Úvodní sekce s gradientem (Kategorie): surface.page nahoře → surface.muted dole; vrství se pod vinětaci */
main>section.ss-grad-top{background-image:linear-gradient(180deg,var(--ss-surface-page,#FFFFFF) 0%,var(--ss-surface-muted,#F3EDE4) 100%)!important;background-attachment:scroll!important;}



/* Nadpisy: světlý režim tmavá modrá z hlavičky #0B1F33 (inline barva vyhrává – bílé nadpisy na tmavých pásech zůstávají) */
h1,h2,h3,h4{color:var(--ss-text-heading,#0B1F33);}

/* Sekce s meruňkovým podsvícením zespoda – poloviční radiál od spodní hrany, vrstvený nad .ss-grad-top */
main>section.ss-grad-top.ss-grad-glow{background-image:radial-gradient(ellipse 55% 100% at 50% 100%,rgba(251,178,85,.22) 0%,rgba(251,178,85,.09) 45%,rgba(251,178,85,0) 75%),linear-gradient(180deg,var(--ss-surface-page,#FFFFFF) 0%,var(--ss-surface-muted,#F3EDE4) 100%)!important;background-size:100% 520px,auto!important;background-position:center bottom,center!important;background-repeat:no-repeat!important;background-attachment:scroll!important;}
html[data-mode="dark"] main>section.ss-grad-top.ss-grad-glow{background-image:radial-gradient(ellipse 55% 100% at 50% 100%,rgba(251,178,85,.14) 0%,rgba(251,178,85,.05) 45%,rgba(251,178,85,0) 75%),linear-gradient(180deg,var(--ss-surface-page,#0E1F2F) 0%,var(--ss-surface-muted,#183049) 100%)!important;}


</style>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Roboto:wght@400..700&display=swap" rel="stylesheet">
<script>try{var d=document.documentElement;if(localStorage.getItem('ss-mode')==='dark')d.setAttribute('data-mode','dark');d.setAttribute('data-logo',localStorage.getItem('ss-logo')||'a');d.setAttribute('data-font-h','base');d.setAttribute('data-font-b','base');d.setAttribute('data-bg',localStorage.getItem('ss-bg')||'on');}catch(e){}</script>
<style>
h1:not(.ss-plain),h2:not(.ss-plain),h3:not(.ss-plain),h4:not(.ss-plain){font-family:Oswald,Helvetica,Arial,sans-serif!important;font-weight:600!important;text-transform:none;letter-spacing:0;}
</style>

<body>
<x-dc>
<helmet>
<style>
.ss-pc{position:relative;font-family:Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;width:100%;min-width:0;height:100%;box-sizing:border-box;background:var(--ss-surface-card,#FFFFFF);border-radius:12px;padding:16px;transition:box-shadow .15s cubic-bezier(.22,.61,.36,1);}
.sc-host:has(>.ss-pc){display:flex;width:100%;height:100%;min-width:0;}
.ss-pc{box-shadow:0 2px 8px rgba(19,44,67,.08);}
.ss-pc:hover{box-shadow:0 4px 12px rgba(19,44,67,.12);}
.ss-pc:has(.ss-pc-cover:focus-visible){box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-pc-cover{position:absolute;inset:0;z-index:1;border-radius:12px;}
.ss-pc-cover:focus-visible{outline:none;}
.ss-pc-title{margin:0;font-size:17px;font-weight:700;line-height:1.3;color:var(--ss-text-primary,#1C2229);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;transition:color .12s cubic-bezier(.22,.61,.36,1);}
.ss-pc:hover .ss-pc-title{color:var(--ss-hover-text,#A4600C);}
.ss-pc-fav{position:absolute;top:0;right:0;z-index:2;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;border-radius:6px;background:#FFFFFF;color:#1C2229;cursor:pointer;transition:color .12s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){.ss-pc-fav[aria-pressed="false"]:hover{color:#21507B;}}
.ss-pc-fav[aria-pressed="true"]{background:#FFFFFF!important;color:#FBB255!important;}
@media (hover:hover) and (pointer:fine){.ss-pc-fav[aria-pressed="true"]:hover{color:#F09A2C!important;}}
.ss-pc-fav:active{transform:scale(.94);}
.ss-pc-fav{transition:background-color .12s cubic-bezier(.22,.61,.36,1),color .12s cubic-bezier(.22,.61,.36,1),transform .06s cubic-bezier(.22,.61,.36,1);}
.ss-pc-fav:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-pc-param{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ss-text-secondary,#3D4750);line-height:1.35;}
.ss-pc-more{position:relative;z-index:2;display:flex;align-items:flex-start;justify-content:center;width:100%;min-height:30px;box-sizing:border-box;text-align:center;font-size:13px;font-weight:600;color:var(--ss-text-muted,#55616C);text-decoration:none;padding:8px 0 0;border-radius:4px;}
.ss-pc-more:hover{color:var(--ss-hover-text,#A4600C);text-decoration:underline;text-underline-offset:3px;}
.ss-pc-more:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-pc-media[data-photo="true"]{background:#FFFFFF!important;}
.ss-pc-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;background:var(--ss-surface-subtle,#FAF5EF);font-size:13px;font-weight:500;line-height:1.35;color:var(--ss-text-secondary,#3D4750);}
.ss-pc-fav-out{top:-8px;right:-8px;}
@media (hover:hover) and (pointer:fine){.ss-pc-rm:hover{color:var(--ss-status-error,#B3261E)!important;background:var(--ss-status-error-surface,#FDF0EF)!important;}}
.ss-pc[data-layout="row"] .ss-pc-fav:not(.ss-pc-fav-out){top:8px;left:8px;right:auto;}
.ss-pc-fav-in{top:12px;right:12px;background:rgba(255,255,255,.2);box-shadow:0 1px 3px rgba(19,44,67,.16);}
.ss-pc-fav-in[aria-pressed="true"]{background:rgba(255,255,255,.2)!important;}
html[data-mode="dark"] .ss-pc-mediawrap{margin:-18px -18px 14px!important;}
html[data-mode="dark"] .ss-pc-fav-in{background:var(--ss-surface-card,#0E1F2F);color:var(--ss-text-primary,#EEF3F8);}
.ss-pc-img{transition:transform .4s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){.ss-pc:hover .ss-pc-img{transform:scale(1.04);}}
@media (prefers-reduced-motion:reduce){.ss-pc-img{transition:none;}.ss-pc:hover .ss-pc-img{transform:none;}}
</style>
</helmet>
<article class="ss-pc" data-layout="{{ layout }}">
  <a class="ss-pc-cover" href="{{ href }}" aria-label="{{ title }}"></a>

  <sc-if value="{{ isRow }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:12px">
      <sc-if value="{{ hasTopBadges }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{ topBadges }}" as="b" hint-placeholder-count="1">
            <dc-import name="Stitek" kind="{{ b.kind }}" label="{{ b.label }}" icon="{{ b.icon }}" hint-size="90px,26px"></dc-import>
          </sc-for>
        </div>
      </sc-if>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start">
        <div style="position:relative;min-width:0">

            <span style="font-family:Oswald,Roboto,sans-serif;font-weight:700;font-size:22px;line-height:1.1;color:var(--ss-text-primary,#1C2229);white-space:nowrap">{{ price }}</span>

      </div>
      <sc-if value="{{ hasMp }}" hint-placeholder-val="{{ false }}">
        <dc-import name="ParametryMatrace" layout="{{ pmLayout }}" tuhost="{{ mp.tuhost }}" tuhost-pct="{{ mp.tuhostPct }}" zatizeni-od="{{ mp.zatizeniOd }}" zatizeni-do="{{ mp.zatizeniDo }}" nosnost-max="{{ mp.nosnostMax }}" vyska="{{ mp.vyska }}" vyska-jadra="{{ mp.vyskaJadra }}" zaruka="{{ mp.zaruka }}" spank-na-boku="{{ mp.spankNaBoku }}" hint-size="100%,130px"></dc-import>
      </sc-if>
      <sc-if value="{{ hasTuhost }}" hint-placeholder-val="{{ false }}">

        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{ params }}" as="pm" hint-placeholder-count="4">
            <span class="ss-pc-chip">
              <span style="display:flex;color:var(--ss-text-heading,#0B1F33);flex:none"><dc-import name="Ikony" iconName="{{ pm.icon }}" size="16" hint-size="16px,16px"></dc-import></span>
              <span>{{ pm.label }}</span>

        </div>
      </sc-if>
      <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ true }}">
        <a class="ss-pc-more" href="{{ href }}" style="padding:4px 0 0">{{ moreLabel }}</a>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{ isStack }}" hint-placeholder-val="{{ true }}">

  <div class="ss-pc-mediawrap" style="position:relative;margin:-16px -16px 14px">
  <div class="ss-pc-media" data-photo="{{ hasImage }}" style="position:relative;width:100%;aspect-ratio:1/1;background:var(--ss-surface-subtle,#FAF5EF);border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:center;color:var(--ss-text-decor,#C8D0D8);overflow:hidden">
    <sc-if value="{{ hasImage }}" hint-placeholder-val="{{ false }}">
      <img decoding="async" class="ss-pc-img" src="{{ image }}" alt="{{ title }}" loading="lazy" style="position:absolute;inset:{{ imgInset }};width:{{ imgSize }};height:{{ imgSize }};object-fit:{{ imgFit }};display:block" />
    </sc-if>
    <sc-if value="{{ noImage }}" hint-placeholder-val="{{ true }}">
      <dc-import name="Ikony" iconName="photo" size="36" hint-size="36px,36px"></dc-import>
    </sc-if>
  </div>
  <div class="ss-pc-badges" data-life="{{ lifestyle }}" style="position:absolute;top:12px;left:12px;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:6px">
    <sc-for list="{{ badges }}" as="b" hint-placeholder-count="1">
      <dc-import name="Stitek" kind="{{ b.kind }}" label="{{ b.label }}" icon="{{ b.icon }}" hint-size="90px,26px"></dc-import>
    </sc-for>
  </div>
  <sc-if value="{{ notRemovable }}" hint-placeholder-val="{{ true }}">
  <button type="button" class="ss-pc-fav ss-pc-fav-in" onClick="{{ toggleFav }}" aria-label="{{ favLabel }}" aria-pressed="{{ favPressed }}">
    <dc-import name="Ikony" iconName="{{ favIcon }}" size="20" hint-size="20px,20px"></dc-import>
  </button>
  </sc-if>
  <sc-if value="{{ removable }}" hint-placeholder-val="{{ false }}">
  <button type="button" class="ss-pc-fav ss-pc-fav-in ss-pc-rm" onClick="{{ onRemoveClick }}" aria-label="{{ removeLabel }}">
    <dc-import name="Ikony" iconName="x" size="20" hint-size="20px,20px"></dc-import>
  </button>
  </sc-if>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;flex:1;min-width:0">
    <div style="min-height:20px">
      <sc-if value="{{ hasRating }}" hint-placeholder-val="{{ true }}">
        <dc-import name="Hodnoceni" variant="kompakt" value="{{ rating }}" count="{{ ratingCount }}" size="small" hint-size="120px,20px"></dc-import>
      </sc-if>
    </div>

    <h3 class="ss-pc-title ss-plain" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:calc(2em * 1.3)">{{ title }}</h3>

    <p style="margin:0;font-size:14px;line-height:1.55;min-height:calc(3em * 1.55);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--ss-text-secondary,#3D4750)">{{ perex }}</p>

    <sc-if value="{{ hasParams }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{ params }}" as="pm" hint-placeholder-count="3">
          <span class="ss-pc-chip">
            <span style="display:flex;color:var(--ss-text-heading,#0B1F33);flex:none"><dc-import name="Ikony" iconName="{{ pm.icon }}" size="16" hint-size="16px,16px"></dc-import></span>
            <span>{{ pm.label }}</span>
          </span>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ hasMp }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ParametryMatrace" layout="{{ pmLayout }}" tuhost="{{ mp.tuhost }}" tuhost-pct="{{ mp.tuhostPct }}" zatizeni-od="{{ mp.zatizeniOd }}" zatizeni-do="{{ mp.zatizeniDo }}" nosnost-max="{{ mp.nosnostMax }}" vyska="{{ mp.vyska }}" vyska-jadra="{{ mp.vyskaJadra }}" zaruka="{{ mp.zaruka }}" spank-na-boku="{{ mp.spankNaBoku }}" hint-size="100%,130px"></dc-import>
    </sc-if>
    <sc-if value="{{ hasTuhost }}" hint-placeholder-val="{{ false }}">
      <div><dc-import name="Tuhost" value="{{ tuhost }}" size="compact" hint-size="200px,24px"></dc-import></div>
    </sc-if>

    <div style="margin-top:auto;padding-top:12px"><dc-import name="Stitek" kind="{{ stockKind }}" label="{{ stockLabel }}" hint-size="180px,20px"></dc-import></div>

    <div style="padding-top:12px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px">
      <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
        <sc-if value="{{ hasBefore }}" hint-placeholder-val="{{ false }}">
          <span style="font-size:14px;color:var(--ss-status-error,#B3261E);text-decoration:line-through">{{ priceBefore }}</span>
        </sc-if>
        <span style="font-family:Oswald,Roboto,sans-serif;font-weight:700;font-size:24px;line-height:1.1;color:var(--ss-text-primary,#1C2229);white-space:nowrap">{{ price }}</span>
      </div>
      <div style="position:relative;z-index:2;flex:none">
        <dc-import name="Tlacitko" label="{{ ctaLabel }}" variant="{{ ctaVariant }}" size="medium" href="{{ href }}" hint-size="130px,44px"></dc-import>
      </div>
    </div>

  </div>
  </sc-if>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:640},&quot;product&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Product&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;A&quot;,&quot;A2&quot;,&quot;B&quot;,&quot;C&quot;,&quot;D&quot;,&quot;E&quot;],&quot;default&quot;:&quot;A&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;stack&quot;,&quot;row&quot;],&quot;default&quot;:&quot;stack&quot;,&quot;tsType&quot;:&quot;'stack' | 'row'&quot;},&quot;onFavourite&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(fav: boolean) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { fav: null };
  renderVals() {
    const p = this.props;
    const d = p.product || { image: '_blob/66ef2119f31d8262ba38ce4bea618a8e.webp' };
    const hasImage = !!d.image;
    const lifestyle = !!d.lifestyle;
    const stock = d.stock || 'inStock';
    const favId = String(d.id || d.slug || d.title || d.href || '');
    let stored = false; try { stored = !!favId && JSON.parse(localStorage.getItem('ss-fav') || '[]').includes(favId); } catch (e) {}
    const fav = this.state.fav === null ? (stored || !!d.favourite) : this.state.fav;
    const badges = [];
    if (d.badge) badges.push({ kind: d.badge, label: d.badgeLabel, icon: d.badge === 'sale' ? 'discount' : undefined });
    if (d.secondBadge) badges.push({ kind: d.secondBadge, label: d.secondBadgeLabel });
    const price = d.price || '7 590 Kč';
    const from = d.priceFrom !== false;
    const layout = p.layout === 'row' ? 'row' : 'stack';
    const num = (v) => parseInt(String(v || '').replace(/\D/g, ''), 10) || 0;
    const pct = d.priceBefore ? Math.round((1 - num(price) / num(d.priceBefore)) * 100) : 0;
    const topBadges = badges.filter(b => b.kind !== 'sale');
    return {
      lifestyle: lifestyle ? 'true' : 'false',
      imgFit: lifestyle ? 'cover' : 'contain',
      // produktová fotka na bílém: produkt odsazen 8 % od okrajů (i při hover zoomu nesahá do kraje); interiér přes celou plochu
      imgInset: lifestyle ? '0' : '8%',
      imgSize: lifestyle ? '100%' : '84%',
      layout, isRow: layout === 'row', isStack: layout !== 'row',
      topBadges, hasTopBadges: topBadges.length > 0,
      discount: '−' + pct + ' %', hasDiscount: pct > 0,
      moreLabel: d.moreLabel, hasMore: !!d.moreLabel,
      hasImage, noImage: !hasImage, image: d.image,
      href: (d.href && d.href !== '#produkt') ? d.href : 'Detail_Postel_3.0.dc.html',
      title: d.title || 'Matrace Spring Variant 22 cm',
      hasPerex: !!d.perex,
      perex: d.perex,
      hasRating: d.rating !== undefined && d.rating !== null,
      rating: d.rating ?? 4.8,
      ratingCount: d.ratingCount ?? 18,
      hasMp: !!d.mp, mp: d.mp || {},
      // A/B test karty: A = pruhy pod sebou (výchozí), A2 = pruhy ve dvou sloupcích, B = dvě malé karty, C = segmenty + pravítko, D = řada profilů a postav, E = kompaktní řádky
      pmLayout: ({ B: 'tiles', A2: 'bars2', C: 'seg', D: 'rada', E: 'kompakt' })[p.variant] || 'bars', pmHint: p.variant === 'B' ? '96px' : '130px',
      hasTuhost: !d.mp && typeof d.tuhost === 'number',
      tuhost: d.tuhost,
      hasParams: !d.mp && !!(d.params && d.params.length),
      params: d.params || [],
      badges,
      stockKind: stock,
      stockLabel: d.stockLabel,
      price: from ? 'od ' + price : price,
      priceBefore: d.priceBefore ? (from ? 'od ' + d.priceBefore : d.priceBefore) : undefined,
      hasBefore: !!d.priceBefore,
      ctaLabel: stock === 'outOfStock' ? 'Hlídat dostupnost' : (d.ctaLabel || 'Zobrazit'),
      ctaVariant: stock === 'outOfStock' ? 'secondary' : 'dark',
      removable: !!p.removable, notRemovable: !p.removable,
      removeLabel: 'Odebrat z oblíbených: ' + (d.title || ''),
      onRemoveClick: () => { if (p.onRemove) p.onRemove(); },
      favIcon: fav ? 'heart-filled' : 'heart',
      favPressed: fav ? 'true' : 'false',
      favLabel: fav ? 'Odebrat z oblíbených' : 'Přidat do oblíbených',
      toggleFav: () => {
        const next = !fav;
        this.setState({ fav: next });
        try { if (favId) { let l = JSON.parse(localStorage.getItem('ss-fav') || '[]').filter(x => x !== favId); if (next) l.push(favId); localStorage.setItem('ss-fav', JSON.stringify(l)); window.dispatchEvent(new Event('ss-fav')); } } catch (e) {}
        if (p.onFavourite) p.onFavourite(next);
      }
    };
  }
}
</script>
