/* Hlavička v tmavém režimu: bez dělicí linky nad menu */
html[data-mode="dark"] .ss-hd-nav{border-top-color:transparent!important;}
/* Karty: v tmavém režimu bez hover podkladu a stínu, mění se jen barva nadpisu */
html[data-mode="dark"] .ss-ct:hover,html[data-mode="dark"] .ss-cat:hover,html[data-mode="dark"] .ss-art:hover,html[data-mode="dark"] .ss-mm-ban:hover,html[data-mode="dark"] .ss-pc:hover,html[data-mode="dark"] .ss-hp-tile:hover{box-shadow:none!important;}
/* Produktová karta: v tmavém režimu bez podkladu, tmavá modrá jen na hover; karty blíž k sobě */
html[data-mode="dark"] .ss-pc{background:transparent;padding:18px;transition:background-color .15s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){html[data-mode="dark"] .ss-pc:hover{background:#0E1F2F;}}
html[data-mode="dark"] .ss-car{gap:8px;}
html[data-mode="dark"] .ss-pgrid{gap:4px!important;}
/* Hover obtažení: 1px gradientní linka, světle modré světlo z levého horního rohu */
html[data-mode="dark"] .ss-pc::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:radial-gradient(ellipse 90% 70% at 0% 0%,rgba(141,179,211,.95) 0%,rgba(141,179,211,.45) 35%,rgba(141,179,211,.16) 65%,rgba(141,179,211,.06) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:0;transition:opacity .15s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){html[data-mode="dark"] .ss-pc:hover::before{opacity:1;}}
html[data-mode="dark"] .ss-pm-card:hover .ss-pm-title,html[data-mode="dark"] .ss-pm-row:hover .ss-pm-title,html[data-mode="dark"] .ss-pc:hover .ss-pc-title,html[data-mode="dark"] .ss-mm-ban:hover{color:#FBB255!important;}

/* Podklad webu: jemný radiální gradient ze středu viewportu (hloubka). Fixní → plynule přes všechny sekce. */
/* Vinětace (Elevace) odebrána 12. 10. 2026 – plné podklady, stíny karet zůstávají vždy */


/* Gradient Zap: elevace všech ploch, které by na gradientu splývaly (karty, filtry, video, boxy). Gradient Vyp = beze změny. */
html .ss-elev,html .ss-ct:not([data-pop="true"]),html .ss-cat,html .ss-hp-tile,html .ss-pd-row,html .ss-mm-art{box-shadow:0 2px 8px rgba(19,44,67,.08)!important;}

@media (hover:hover) and (pointer:fine){
html a.ss-elev:hover,html button.ss-elev:hover,html .ss-ct:not([data-pop="true"]):hover,html .ss-cat:hover,html .ss-hp-tile:hover,html .ss-pd-row:hover{box-shadow:0 4px 12px rgba(19,44,67,.12)!important;}
html[data-mode="dark"] a.ss-elev:hover,html[data-mode="dark"] button.ss-elev:hover,html[data-mode="dark"] .ss-ct:not([data-pop="true"]):hover,html[data-mode="dark"] .ss-cat:hover,html[data-mode="dark"] .ss-hp-tile:hover,html[data-mode="dark"] .ss-pd-row:hover{box-shadow:inset 0 1px 0 rgba(141,179,211,.18),0 0 0 1px rgba(141,179,211,.14),0 8px 24px rgba(0,0,0,.45)!important;}
}
html .ss-ct[data-pop="true"]::before{box-shadow:0 2px 8px rgba(19,44,67,.08);}
html[data-mode="dark"] .ss-ct[data-pop="true"]::before{box-shadow:inset 0 1px 0 rgba(141,179,211,.14),0 0 0 1px rgba(141,179,211,.10),0 2px 8px rgba(0,0,0,.35);}
@media (hover:hover) and (pointer:fine){html .ss-ct[data-pop="true"]:hover::before{box-shadow:0 4px 12px rgba(19,44,67,.12);}html[data-mode="dark"] .ss-ct[data-pop="true"]:hover::before{box-shadow:inset 0 1px 0 rgba(141,179,211,.18),0 0 0 1px rgba(141,179,211,.14),0 8px 24px rgba(0,0,0,.45);}}
html .ss-elev:focus-visible{box-shadow:0 0 0 3px rgba(41,96,147,.35)!important;}

/* Prezentační přepínač fontů – html[data-font-h|data-font-b]="alt" */
html[data-font-h="alt"] h1:not(.ss-plain),html[data-font-h="alt"] h2:not(.ss-plain),html[data-font-h="alt"] h3:not(.ss-plain),html[data-font-h="alt"] h4:not(.ss-plain),html[data-font-h="alt"] [style*="Oswald"]{font-family:'Barlow Condensed',Oswald,Helvetica,Arial,sans-serif!important;}
html[data-font-b="alt"] body,html[data-font-b="alt"] [style*="Roboto"]:not([style*="Archivo"]):not([style*="Oswald"]),html[data-font-b="alt"] input,html[data-font-b="alt"] button,html[data-font-b="alt"] select,html[data-font-b="alt"] textarea{font-family:'IBM Plex Sans Condensed',Roboto,Helvetica,Arial,sans-serif!important;}
html[data-mode="dark"] .ss-ct:hover .ss-ct-title,html[data-mode="dark"] .ss-hp-art:hover .ss-hp-art-t,html[data-mode="dark"] .ss-mag-lead:hover .ss-hp-art-t{color:#FBB255;}

/* Centrální scrim pro všechny modály a drawery (oba režimy): blur 16 px, diagonální závoj, teplé bodové světlo z levého horního rohu */
.ss-scrim{background:radial-gradient(ellipse 75% 65% at 0% 0%,rgba(251,178,85,.34) 0%,rgba(251,178,85,.12) 40%,rgba(251,178,85,0) 70%),radial-gradient(ellipse 70% 60% at 100% 100%,rgba(240,154,44,.36) 0%,rgba(240,154,44,.12) 40%,rgba(240,154,44,0) 70%),linear-gradient(135deg,rgba(9,18,27,.6) 0%,rgba(9,18,27,.74) 50%,rgba(6,12,18,.8) 100%);-webkit-backdrop-filter:blur(16px) saturate(.9);backdrop-filter:blur(16px) saturate(.9);}
/* Vyhledávání v hlavičce: teplé bodové světlo na podkladu pole (tmavý režim) */
html[data-mode="dark"] .ss-hd .ss-input{background-image:radial-gradient(ellipse 45% 140% at 0% 0%,rgba(251,178,85,.20) 0%,rgba(251,178,85,.07) 45%,rgba(251,178,85,0) 75%)!important;}
html[data-mode="dark"] .ss-hd .ss-input:focus{background-image:radial-gradient(ellipse 55% 160% at 0% 0%,rgba(251,178,85,.28) 0%,rgba(251,178,85,.10) 45%,rgba(251,178,85,0) 80%)!important;}

html[data-mode="dark"] .ss-hd-tab[aria-current="page"]{color:#FBB255;}

/* Filtrační panel: světlý bílý (surface.card), tmavý zůstává surface.subtle */
html[data-mode="dark"] .ss-filtr{background:var(--ss-surface-subtle,#13283C)!important;}

/* Úvodní sekce s gradientem (Kategorie): surface.page nahoře → surface.muted dole; vrství se pod vinětaci */
main>section.ss-grad-top{background-image:linear-gradient(180deg,var(--ss-surface-page,#FFFFFF) 0%,var(--ss-surface-muted,#F3EDE4) 100%)!important;background-attachment:scroll!important;}



/* Nadpisy: světlý režim tmavá modrá z hlavičky #0B1F33 (inline barva vyhrává – bílé nadpisy na tmavých pásech zůstávají) */
h1,h2,h3,h4{color:var(--ss-text-heading,#0B1F33);}

/* Sekce s meruňkovým podsvícením zespoda – poloviční radiál od spodní hrany, vrstvený nad .ss-grad-top */
main>section.ss-grad-top.ss-grad-glow{background-image:radial-gradient(ellipse 55% 100% at 50% 100%,rgba(251,178,85,.22) 0%,rgba(251,178,85,.09) 45%,rgba(251,178,85,0) 75%),linear-gradient(180deg,var(--ss-surface-page,#FFFFFF) 0%,var(--ss-surface-muted,#F3EDE4) 100%)!important;background-size:100% 520px,auto!important;background-position:center bottom,center!important;background-repeat:no-repeat!important;background-attachment:scroll!important;}
html[data-mode="dark"] main>section.ss-grad-top.ss-grad-glow{background-image:radial-gradient(ellipse 55% 100% at 50% 100%,rgba(251,178,85,.14) 0%,rgba(251,178,85,.05) 45%,rgba(251,178,85,0) 75%),linear-gradient(180deg,var(--ss-surface-page,#0E1F2F) 0%,var(--ss-surface-muted,#183049) 100%)!important;}

<style>
.ss-hd{font-family:Roboto,Helvetica,Arial,sans-serif;}
.ss-hd a{text-decoration:none;}
.ss-hd-util{color:var(--ss-text-secondary,#3D4750);font-size:13px;display:inline-flex;align-items:center;min-height:24px;padding:0 6px;border-radius:4px;transition:color .12s cubic-bezier(.22,.61,.36,1);}
.ss-hd-util:hover{color:var(--ss-hover-text,#A4600C);}
.ss-hd-util:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-hd-action{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:56px;height:52px;border:0;background:none;padding:0 8px;border-radius:8px;color:var(--ss-link-hover,#21507B);font:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:background-color .12s cubic-bezier(.22,.61,.36,1);}
.ss-hd-action:hover{background:var(--ss-hover-bg,#FFF5E6);color:var(--ss-hover-text,#A4600C)}
.ss-hd-burger{color:var(--ss-text-primary,#1C2229);}
@media (hover:hover) and (pointer:fine){.ss-hd-burger:hover{background:var(--ss-hover-bg,#FFF5E6);color:var(--ss-hover-text,#A4600C);}}
.ss-hd-action:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-hd-tab{text-decoration:none;position:relative;display:inline-flex;align-items:center;height:48px;padding:0 var(--ss-tab-px,14px);border:0;background:none;font:inherit;font-size:15px;font-weight:600;color:var(--ss-text-primary,#1C2229);cursor:pointer;transition:color .12s cubic-bezier(.22,.61,.36,1);}
/* Pod 1400 px těsnější záložky, aby se 8 sekcí vešlo bez posouvání (4. 11. 2026) */
.ss-hd-tab:hover{color:var(--ss-hover-text,#A4600C);}
.ss-hd-navwrap{position:relative;flex:1 1 auto;min-width:0;}
/* Šipky pro posun lišty bez dotyku/scrollbaru (4. 11. 2026): vpravo na konci přechodu + svislá čára před Prodejnami, vlevo pro návrat */
.ss-hd-navbtn{position:absolute;top:50%;z-index:1;display:flex;align-items:center;justify-content:center;width:36px;height:40px;margin-top:-20px;padding:0;border:0;border-radius:6px;background:none;color:var(--ss-text-primary,#1C2229);cursor:pointer;transition:color .12s cubic-bezier(.22,.61,.36,1),background-color .12s cubic-bezier(.22,.61,.36,1);}
.ss-hd-navbtn[data-side="r"]{right:0;width:44px;padding-right:8px;justify-content:flex-end;}
.ss-hd-navbtn[data-side="r"]::after{content:"";position:absolute;right:0;top:8px;bottom:8px;width:1px;background:var(--ss-border-strong,#C8D0D8);}
.ss-hd-navbtn[data-side="l"]{left:0;justify-content:flex-start;}
@media (hover:hover) and (pointer:fine){.ss-hd-navbtn:hover{color:var(--ss-hover-text,#21507B);}}
.ss-hd-navbtn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-hd-navscroll{display:flex;align-items:center;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain;scroll-padding:0 92px;padding:3px;margin:-3px;}
.ss-hd-navscroll::-webkit-scrollbar{display:none;}
.ss-hd-navscroll .ss-hd-tab{flex:none;white-space:nowrap;gap:4px;}
/* Užší šířky: menší rozestupy mezi sekcemi, písmo beze změny (4. 11. 2026) */
@media (max-width:1559px){.ss-hd-navscroll .ss-hd-tab{--ss-tab-px:10px;}}
@media (max-width:1279px){.ss-hd-navscroll .ss-hd-tab{--ss-tab-px:8px;}}
.ss-hd-tabchev{display:inline-flex;transition:transform .15s cubic-bezier(.22,.61,.36,1),color .12s cubic-bezier(.22,.61,.36,1);}
.ss-hd-tab[data-open="true"] .ss-hd-tabchev{color:#FBB255;transform:translateY(2px);}
@media (hover:hover) and (pointer:fine){.ss-hd-tab:hover .ss-hd-tabchev{color:#FBB255;transform:translateY(2px);}}
@media (prefers-reduced-motion:reduce){.ss-hd-tabchev{transition:none;}}
.ss-hd-navwrap[data-fade-r="true"] .ss-hd-navscroll{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 92px),transparent calc(100% - 44px));mask-image:linear-gradient(to right,#000 calc(100% - 92px),transparent calc(100% - 44px));}
.ss-hd-navwrap[data-fade-l="true"] .ss-hd-navscroll{-webkit-mask-image:linear-gradient(to right,transparent 36px,#000 80px);mask-image:linear-gradient(to right,transparent 36px,#000 80px);}

      ...(() => { const h = w < 420 ? 18 : narrow ? 28 : 34, u = h / 64.196, s = (x, y) => ({ display: 'none', width: ((341.374 + 2 * x) * u) + 'px', height: (h + 2 * y * u) + 'px', margin: (-y * u) + 'px ' + (-x * u) + 'px', position: 'relative', zIndex: 0, pointerEvents: 'none' }); return { logoDkA: s(0, 0), logoDkB: s(3, 3), logoDkC: s(8, 3), logoDkD: s(6, 6) }; })(),
      mainPad: narrow ? '10px 16px' : '14px 32px',
      mainGap: narrow ? '8px' : '20px',
      hdHiddenStr: this.state.hdHidden ? 'true' : 'false',
      headerStyle: {
        position: 'sticky', top: 0, zIndex: 200, width: '100%',
        background: tint ? '#296093' : 'var(--ss-surface-page,#FFFFFF)', boxShadow: '0 2px 8px rgba(19,44,67,.08)',
        // Otevřené okno (přihlášení, košík, menu) je uvnitř hlavičky: hlavička se nesmí schovat, jinak okno odjede s ní (29. 10. 2026)
        transform: (this.state.hdHidden && !(this.state.loginOpen || this.state.cartOpen || this.state.mobileOpen)) ? 'translateY(calc(-100% - 12px))' : 'none',
        transition: 'transform .4s cubic-bezier(.22,.61,.36,1)'
      },
      cartCount,
      cartTotal,
      cmpCount: this.state.cmpN,
      hasCmp: this.state.cmpN > 0,
      cmpAria: this.state.cmpN > 0 ? 'Porovnat, ' + this.state.cmpN + ' produktů' : 'Porovnat',
      favCount: this.state.favN,
      hasFav: this.state.favN > 0,
      favAria: this.state.favN > 0 ? 'Oblíbené, ' + this.state.favN + ' produktů' : 'Oblíbené',
      cartItems: cart,
      onCartQty: (idx, v) => this.setState(s => {
        const next = s.cart.map((it, i) => i === idx ? Object.assign({}, it, { qty: v, price: fmt(it.unit * v) }) : it);
        return { cart: next };
      }),
      onCartRemove: (idx) => this.setState(s => ({ cart: s.cart.filter((_, i) => i !== idx) })),
      query,
      onQuery: (v) => { if (this.state.mobileOpen && v) { this.setState({ mobileOpen: false, query: v, suggestDismissed: false }); } else this.setState({ query: v, suggestDismissed: false }); },
      submitSearch: (e) => { e.preventDefault(); if (p.onSearch) p.onSearch(query); (h => { try { const a = document.createElement('a'); a.href = h; a.style.display = 'none'; (document.getElementById('dc-root') || document.body).appendChild(a); a.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window })); a.remove(); } catch (e) { window.location.href = h; } })('VysledkyVyhledavani.dc.html'); },
      doSearch: () => { if (p.onSearch) p.onSearch(query); (h => { try { const a = document.createElement('a'); a.href = h; a.style.display = 'none'; (document.getElementById('dc-root') || document.body).appendChild(a); a.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window })); a.remove(); } catch (e) { window.location.href = h; } })('VysledkyVyhledavani.dc.html'); },
      suggestOpen: open || (!!this.state.searchIntro && q.length < 2),
      // Mobil: našeptávač vyplní stránku až dolů, aby pod ním nebyl vidět e-shop
      suggestWrapStyle: narrow
        ? { position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 300, height: (hb => this.state.vvh ? Math.max(160, this.state.vvh - hb) + 'px' : 'calc(100dvh - ' + hb + 'px)')(Math.max(0, Math.round(this._header ? this._header.getBoundingClientRect().bottom : (this.state.headerH || 120)))), paddingBottom: '24px', boxSizing: 'border-box', overflowY: 'auto', overscrollBehavior: 'contain', WebkitOverflowScrolling: 'touch', touchAction: 'pan-y', background: 'var(--ss-surface-page,#FFFFFF)' }
        : { position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 300 },
      suggestProducts: this.state.searchIntro && q.length < 2 ? undefined : suggestProducts,
      suggestCategories: this.state.searchIntro && q.length < 2 ? undefined : suggestCategories,
      suggestTotal: this.state.searchIntro && q.length < 2 ? undefined : suggestProducts.length,
      suggestPad: narrow ? '0 16px' : '0 32px',
      closeSuggest: () => this.setState({ query: '', searchIntro: false }),
      tabs: cats.map((c, i) => ({
        label: c.label, // plné názvy vždy, při nedostatku místa vodorovný scroll lišty (4. 11. 2026)
        open: openIndex === i ? 'true' : 'false',
        expanded: (c.groups && c.groups.length) ? (openIndex === i ? 'true' : 'false') : undefined,
        current: p.activeCategory === c.label ? 'page' : undefined,
        highlight: c.highlight ? 'true' : undefined,
        chevron: (p.navVariant || this.state.navV || 'M2') === 'M2' && !!(c.groups && c.groups.length),
        style: c.highlight ? { color: blue ? '#FBB255' : 'var(--ss-text-apricot,#A4600C)' } : undefined,
        // Mega menu: najetí myší se zpožděním 200 ms (ať se neotevírá při přejetí), fokus hned; na dotyku (tablet) první ťuknutí jen otevře, druhé vede na sekci (4. 11. 2026)
        onEnter: (e) => {
          const hasG = !!(c.groups && c.groups.length);
          if (this._hoverT) clearTimeout(this._hoverT);
          if (e && e.type === 'focus') { this._openT = Date.now(); this.setState({ open: hasG ? i : -1, storesOpen: false }); return; }
          this._hoverT = setTimeout(() => { this._hoverT = null; this._openT = Date.now(); this.setState({ open: hasG ? i : -1, storesOpen: false }); }, 200);
        },
        onLeave: () => { if (this._hoverT) { clearTimeout(this._hoverT); this._hoverT = null; } },
        onClick: (e) => {
          const hasG = !!(c.groups && c.groups.length);
          if (!hasG || !this._touch()) return;
          // Druhé ťuknutí na už otevřenou sekci (otevřenou déle než 600 ms – fokus z téhož ťuknutí ji otevře hned) vede na stránku sekce
          if (this.state.open === i && Date.now() - (this._openT || 0) > 600) return;
          e.preventDefault();
          this._openT = Date.now();
          this.setState({ open: i, storesOpen: false });
        },
        href: c.href || 'Kategorie.dc.html'
      })),
      megaOpen: !narrow && openIndex >= 0 && !!(cats[openIndex] && cats[openIndex].groups),
      // Mega menu vyšší než okno: výška panelu = od jeho horní hrany po spodek okna, uvnitř se scrolluje až na konec (6. 11. 2026)
      megaRef: this._megaRef || (this._megaRef = (el) => {
        if (this._megaFit) { window.removeEventListener('resize', this._megaFit); window.removeEventListener('scroll', this._megaFit); this._megaFit = null; }
        if (!el) return;
        this._megaFit = () => { try { const t = el.getBoundingClientRect().top; el.style.maxHeight = Math.max(240, window.innerHeight - Math.max(0, t) - 8) + 'px'; } catch (e) {} };
        this._megaFit(); requestAnimationFrame(this._megaFit); setTimeout(this._megaFit, 300);
        window.addEventListener('resize', this._megaFit); window.addEventListener('scroll', this._megaFit, { passive: true });
      }),
      megaCategory: cats[openIndex],
      megaTouch: this._touch(),
      // Mobilní menu v2: otevřená sekce (název v hlavičce okna, šipka zpět) (4. 11. 2026)
      mobileTitle: (this.state.mobileSec >= 0 && cats[this.state.mobileSec]) ? cats[this.state.mobileSec].label : 'Menu',
      mobileData: { section: this.state.mobileSec >= 0 ? this.state.mobileSec : null },
      onMobileEvent: (t, a) => { if (t === 'open') this.setState({ mobileSec: a }); else if (t === 'back') this.setState({ mobileSec: -1 }); else if (t === 'close') this.setState({ mobileOpen: false, mobileSec: -1 }); },
      mobileBack: (this.state.mobileSec >= 0) ? (() => this.setState({ mobileSec: -1 })) : undefined,
      closeMega: () => {
        // Na dotyku (tablet) přijde syntetické mouseleave hned po ťuknutí – menu zavírá jen ťuknutí mimo nebo Escape
        if (this._touch()) return;
        if (this._hoverT) { clearTimeout(this._hoverT); this._hoverT = null; }
        if (this.state.open >= 0) this.setState({ open: -1 });
        if (this.state.storesOpen) this.setState({ storesOpen: false });
      },
      storesOpen: !narrow && !!this.state.storesOpen,
      storesExpanded: this.state.storesOpen ? 'true' : 'false',
      openStores: () => this.setState({ storesOpen: true, open: -1 }),
      toggleStores: () => this.setState(s => ({ storesOpen: !s.storesOpen, open: -1 })),
      mobileOpen: this.state.mobileOpen,
      mobileExpanded: this.state.mobileOpen ? 'true' : 'false',
      openMobile: this.openMobile,
      closeMobile: this.closeMobile,
      headerRef: (el) => { this._header = el; },
      loginOpen: !!this.state.loginOpen,
      openLogin: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        this.setState({ loginOpen: true, open: -1, mobileOpen: false });
      },
      closeLogin: () => { this.setState({ loginOpen: false }); },
      loginData: {},
      onLoginEvent: () => {},
      cartOpen: !!this.state.cartOpen,
      cartData: { items: cart, total: cartTotal },
      cartPrimary: cart.length ? 'Ukázat košík' : '',
      cartSecondary: cart.length ? 'Pokračovat v nákupu' : '',
      onCartEvent: (t, a, b) => {
        if (t === 'qty') this.setState(s => ({ cart: s.cart.map((it, i) => i === a ? Object.assign({}, it, { qty: b, price: fmt(it.unit * b) }) : it) }));
        else if (t === 'remove') this.setState(s => ({ cart: s.cart.filter((_, i) => i !== a) }));
      },
      openCart: () => { this.setState({ cartOpen: true, open: -1 }); },
      closeCart: () => { this.setState({ cartOpen: false }); }
    };
  }
}
