  --ss-link-hover:#B9D0E5;
  --ss-usp-from-c:#8DB3D3;
  --ss-usp-to-c:#FBB255;
  --ss-text-apricot:#FBB255;
  --ss-usp-title:#FBB255;
  --ss-hover-text:#FBB255;

html[data-mode="dark"],html[data-mode="dark"] body{background:#0E1F2F;}
html[data-mode="dark"] .ss-hd-logo-pos{display:none!important;}
html[data-mode="dark"] .ss-hd-logo-neg{display:block!important;}
html[data-mode="dark"][data-logo="a"] .ss-hd-logo-neg,html[data-mode="dark"][data-logo="b"] .ss-hd-logo-neg,html[data-mode="dark"][data-logo="c"] .ss-hd-logo-neg,html[data-mode="dark"][data-logo="d"] .ss-hd-logo-neg{display:none!important;}
html[data-mode="dark"][data-logo="a"] .ss-hd-logo-a,html[data-mode="dark"][data-logo="b"] .ss-hd-logo-b,html[data-mode="dark"][data-logo="c"] .ss-hd-logo-c,html[data-mode="dark"][data-logo="d"] .ss-hd-logo-d{display:block!important;}
html[data-mode="dark"] img{filter:none;}

/* Oddělení hlavičky a overlay panelů v tmavém režimu */
html[data-mode="dark"] .ss-hd{box-shadow:0 1px 0 rgba(141,179,211,.18),0 8px 24px rgba(0,0,0,.45)!important;}
/* Hlavička: horní lišta a hlavní řádek průsvitné s background blur, menu (.ss-hd-nav) zůstává plné */
html[data-mode="dark"] .ss-hd{background:transparent!important;}
html[data-mode="dark"] .ss-hd-topbar{background-color:rgba(19,40,60,.72)!important;-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);}
html[data-mode="dark"] .ss-hd-main{background-color:rgba(14,31,47,.72)!important;-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);}
html[data-mode="dark"] .ss-hd-topbar{border-bottom-color:transparent!important;}
html[data-mode="dark"] .ss-hd-nav{border-top-color:transparent!important;background-color:#13283C!important;background-image:linear-gradient(180deg,#13283C 0%,#102336 100%)!important;}
html[data-mode="dark"] .ss-mm{background:#13283C!important;box-shadow:inset 0 1px 0 rgba(141,179,211,.18),0 0 0 1px rgba(141,179,211,.14),0 24px 48px rgba(0,0,0,.6)!important;}
html[data-mode="dark"] .ss-hd .ss-pm{background:#13283C!important;box-shadow:inset 0 1px 0 rgba(141,179,211,.18),0 0 0 1px rgba(141,179,211,.14),0 24px 48px rgba(0,0,0,.6)!important;}
html[data-mode="dark"] .ss-pm-card{background:#13283C;}
html[data-mode="dark"] .ss-pm-card:hover{background:#13283C!important;box-shadow:none!important;color:inherit!important;}
html[data-mode="dark"] .ss-pm-row:hover{background:transparent!important;box-shadow:none!important;color:inherit!important;}

/* Ostrůvek světlého režimu (popupy nad fotkami – produktové fotky mají bílé pozadí) */
html[data-mode="dark"] .ss-light{color-scheme:light;
  --ss-hover-text:#21507B;
  --ss-hover-bg:#F0F5FA;
  --ss-text-apricot:initial;
  --ss-usp-title:initial;
  --ss-border-accent-subtle:initial;

  --ss-action-tonal-bg:initial;
  --ss-action-tonal-hover-bg:initial;

  --ss-border-action-hover:initial;
  --ss-border-error:initial;
  --ss-border-error-subtle:initial;
  --ss-border-faint:initial;
  --ss-border-hover:initial;
  --ss-border-strong:initial;
  --ss-border-subtle:initial;
  --ss-border-success-subtle:initial;
  --ss-link:initial;
  --ss-link-hover:initial;
  --ss-status-error:initial;

  --ss-status-success-strong:initial;

  --ss-surface-accent:initial;

  --ss-text-disabled:initial;
  --ss-text-muted:initial;
  --ss-text-primary:initial;
  --ss-text-secondary:initial;
}

/* Hlavička v tmavém režimu: bez dělicí linky nad menu */
html[data-mode="dark"] .ss-hd-nav{border-top-color:transparent!important;}
/* Karty: v tmavém režimu bez hover podkladu a stínu, mění se jen barva nadpisu */
html[data-mode="dark"] .ss-ct:hover,html[data-mode="dark"] .ss-cat:hover,html[data-mode="dark"] .ss-art:hover,html[data-mode="dark"] .ss-mm-ban:hover,html[data-mode="dark"] .ss-pc:hover,html[data-mode="dark"] .ss-hp-tile:hover{box-shadow:none!important;}
/* Produktová karta: v tmavém režimu bez podkladu, tmavá modrá jen na hover; karty blíž k sobě */
html[data-mode="dark"] .ss-pc{background:transparent;padding:18px;transition:background-color .15s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){html[data-mode="dark"] .ss-pc:hover{background:#0E1F2F;}}
html[data-mode="dark"] .ss-car{gap:8px;}
html[data-mode="dark"] .ss-pgrid{gap:4px!important;}
/* Hover obtažení: 1px gradientní linka, světle modré světlo z levého horního rohu */
html[data-mode="dark"] .ss-pc::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:radial-gradient(ellipse 90% 70% at 0% 0%,rgba(141,179,211,.95) 0%,rgba(141,179,211,.45) 35%,rgba(141,179,211,.16) 65%,rgba(141,179,211,.06) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:0;transition:opacity .15s cubic-bezier(.22,.61,.36,1);}
@media (hover:hover) and (pointer:fine){html[data-mode="dark"] .ss-pc:hover::before{opacity:1;}}
html[data-mode="dark"] .ss-pm-card:hover .ss-pm-title,html[data-mode="dark"] .ss-pm-row:hover .ss-pm-title,html[data-mode="dark"] .ss-pc:hover .ss-pc-title,html[data-mode="dark"] .ss-mm-ban:hover{color:#FBB255!important;}

/* Podklad webu: jemný radiální gradient ze středu viewportu (hloubka). Fixní → plynule přes všechny sekce. */
/* Vinětace (Elevace) odebrána 12. 10. 2026 – plné podklady, stíny karet zůstávají vždy */


/* Gradient Zap: elevace všech ploch, které by na gradientu splývaly (karty, filtry, video, boxy). Gradient Vyp = beze změny. */
html .ss-elev,html .ss-ct:not([data-pop="true"]),html .ss-cat,html .ss-hp-tile,html .ss-pd-row,html .ss-mm-art{box-shadow:0 2px 8px rgba(19,44,67,.08)!important;}
html[data-mode="dark"] .ss-elev,html[data-mode="dark"] .ss-ct:not([data-pop="true"]),html[data-mode="dark"] .ss-cat,html[data-mode="dark"] .ss-hp-tile,html[data-mode="dark"] .ss-pd-row{box-shadow:inset 0 1px 0 rgba(141,179,211,.14),0 0 0 1px rgba(141,179,211,.10),0 2px 8px rgba(0,0,0,.35)!important;}
@media (hover:hover) and (pointer:fine){
html a.ss-elev:hover,html button.ss-elev:hover,html .ss-ct:not([data-pop="true"]):hover,html .ss-cat:hover,html .ss-hp-tile:hover,html .ss-pd-row:hover{box-shadow:0 4px 12px rgba(19,44,67,.12)!important;}
html[data-mode="dark"] a.ss-elev:hover,html[data-mode="dark"] button.ss-elev:hover,html[data-mode="dark"] .ss-ct:not([data-pop="true"]):hover,html[data-mode="dark"] .ss-cat:hover,html[data-mode="dark"] .ss-hp-tile:hover,html[data-mode="dark"] .ss-pd-row:hover{box-shadow:inset 0 1px 0 rgba(141,179,211,.18),0 0 0 1px rgba(141,179,211,.14),0 8px 24px rgba(0,0,0,.45)!important;}
}
html .ss-ct[data-pop="true"]::before{box-shadow:0 2px 8px rgba(19,44,67,.08);}
html[data-mode="dark"] .ss-ct[data-pop="true"]::before{box-shadow:inset 0 1px 0 rgba(141,179,211,.14),0 0 0 1px rgba(141,179,211,.10),0 2px 8px rgba(0,0,0,.35);}
@media (hover:hover) and (pointer:fine){html .ss-ct[data-pop="true"]:hover::before{box-shadow:0 4px 12px rgba(19,44,67,.12);}html[data-mode="dark"] .ss-ct[data-pop="true"]:hover::before{box-shadow:inset 0 1px 0 rgba(141,179,211,.18),0 0 0 1px rgba(141,179,211,.14),0 8px 24px rgba(0,0,0,.45);}}
html .ss-elev:focus-visible{box-shadow:0 0 0 3px rgba(41,96,147,.35)!important;}

/* Prezentační přepínač fontů – html[data-font-h|data-font-b]="alt" */
html[data-font-h="alt"] h1:not(.ss-plain),html[data-font-h="alt"] h2:not(.ss-plain),html[data-font-h="alt"] h3:not(.ss-plain),html[data-font-h="alt"] h4:not(.ss-plain),html[data-font-h="alt"] [style*="Oswald"]{font-family:'Barlow Condensed',Oswald,Helvetica,Arial,sans-serif!important;}
html[data-font-b="alt"] body,html[data-font-b="alt"] [style*="Roboto"]:not([style*="Archivo"]):not([style*="Oswald"]),html[data-font-b="alt"] input,html[data-font-b="alt"] button,html[data-font-b="alt"] select,html[data-font-b="alt"] textarea{font-family:'IBM Plex Sans Condensed',Roboto,Helvetica,Arial,sans-serif!important;}
html[data-mode="dark"] .ss-ct:hover .ss-ct-title,html[data-mode="dark"] .ss-hp-art:hover .ss-hp-art-t,html[data-mode="dark"] .ss-mag-lead:hover .ss-hp-art-t{color:#FBB255;}

/* Centrální scrim pro všechny modály a drawery (oba režimy): blur 16 px, diagonální závoj, teplé bodové světlo z levého horního rohu */
.ss-scrim{background:radial-gradient(ellipse 75% 65% at 0% 0%,rgba(251,178,85,.34) 0%,rgba(251,178,85,.12) 40%,rgba(251,178,85,0) 70%),radial-gradient(ellipse 70% 60% at 100% 100%,rgba(240,154,44,.36) 0%,rgba(240,154,44,.12) 40%,rgba(240,154,44,0) 70%),linear-gradient(135deg,rgba(9,18,27,.6) 0%,rgba(9,18,27,.74) 50%,rgba(6,12,18,.8) 100%);-webkit-backdrop-filter:blur(16px) saturate(.9);backdrop-filter:blur(16px) saturate(.9);}
/* Vyhledávání v hlavičce: teplé bodové světlo na podkladu pole (tmavý režim) */
html[data-mode="dark"] .ss-hd .ss-input{background-image:radial-gradient(ellipse 45% 140% at 0% 0%,rgba(251,178,85,.20) 0%,rgba(251,178,85,.07) 45%,rgba(251,178,85,0) 75%)!important;}
html[data-mode="dark"] .ss-hd .ss-input:focus{background-image:radial-gradient(ellipse 55% 160% at 0% 0%,rgba(251,178,85,.28) 0%,rgba(251,178,85,.10) 45%,rgba(251,178,85,0) 80%)!important;}

html[data-mode="dark"] .ss-hd-tab[aria-current="page"]{color:#FBB255;}

/* Filtrační panel: světlý bílý (surface.card), tmavý zůstává surface.subtle */
html[data-mode="dark"] .ss-filtr{background:var(--ss-surface-subtle,#13283C)!important;}

/* Úvodní sekce s gradientem (Kategorie): surface.page nahoře → surface.muted dole; vrství se pod vinětaci */
main>section.ss-grad-top{background-image:linear-gradient(180deg,var(--ss-surface-page,#FFFFFF) 0%,var(--ss-surface-muted,#F3EDE4) 100%)!important;background-attachment:scroll!important;}



/* Nadpisy: světlý režim tmavá modrá z hlavičky #0B1F33 (inline barva vyhrává – bílé nadpisy na tmavých pásech zůstávají) */
h1,h2,h3,h4{color:var(--ss-text-heading,#0B1F33);}

/* Sekce s meruňkovým podsvícením zespoda – poloviční radiál od spodní hrany, vrstvený nad .ss-grad-top */
main>section.ss-grad-top.ss-grad-glow{background-image:radial-gradient(ellipse 55% 100% at 50% 100%,rgba(251,178,85,.22) 0%,rgba(251,178,85,.09) 45%,rgba(251,178,85,0) 75%),linear-gradient(180deg,var(--ss-surface-page,#FFFFFF) 0%,var(--ss-surface-muted,#F3EDE4) 100%)!important;background-size:100% 520px,auto!important;background-position:center bottom,center!important;background-repeat:no-repeat!important;background-attachment:scroll!important;}
html[data-mode="dark"] main>section.ss-grad-top.ss-grad-glow{background-image:radial-gradient(ellipse 55% 100% at 50% 100%,rgba(251,178,85,.14) 0%,rgba(251,178,85,.05) 45%,rgba(251,178,85,0) 75%),linear-gradient(180deg,var(--ss-surface-page,#0E1F2F) 0%,var(--ss-surface-muted,#183049) 100%)!important;}

<body>

<helmet>
<style>
/* Mobilní menu v2 (4. 11. 2026, Mural „NÁVRH 10/2026 – v2“): dvě úrovně – sekce s fotkou + zkratky, v sekci Zobrazit vše, rozměry jako tlačítka, kategorie s miniaturami, promo a Poradíme na konci. Žluté podkategorie se nezobrazují. */
.ss-mob,.ss-mob *{box-sizing:border-box;}
.ss-mob{font-family:Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;width:100%;min-width:0;overflow-x:hidden;}
.ss-mob a{text-decoration:none;}
.ss-mob-row{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 var(--ss-ov-pad,16px);margin:0;border:0;background:none;font:inherit;font-size:17px;color:var(--ss-text-primary,#1C2229);text-align:left;text-decoration:none;cursor:pointer;transition:background-color .12s cubic-bezier(.22,.61,.36,1);}
.ss-mob-row:active{background:var(--ss-surface-muted,#F3EDE4);}
.ss-mob-row:focus-visible{outline:none;box-shadow:inset 0 0 0 3px rgba(41,96,147,.35);}
.ss-mob-icon{display:flex;color:var(--ss-text-muted,#55616C);flex:none;}
/* 1. úroveň: sekce s malou fotkou, celý řádek otevírá */
.ss-mob-sec{min-height:60px;font-family:Oswald,Roboto,Helvetica,Arial,sans-serif;font-weight:600;font-size:22px;}
.ss-mob-sec[data-hl="true"]{color:var(--ss-status-error,#B3261E);}
.ss-mob-ph{display:block;width:48px;height:48px;flex:none;border-radius:8px;overflow:hidden;background:var(--ss-surface-page,#FFFFFF);}
.ss-mob-ph>span{display:block;width:100%;height:100%;background-position:center;}
.ss-mob-ph[data-size="sm"]{width:40px;height:40px;}
/* Rychlé zkratky pod sekcemi */
.ss-mob-quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px var(--ss-ov-pad,16px);}
.ss-mob-qt{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border-radius:10px;background:var(--ss-surface-subtle,#FAF5EF);color:var(--ss-text-primary,#1C2229);font-size:15px;font-weight:600;line-height:1.25;border:0;font-family:inherit;text-align:left;cursor:pointer;}
.ss-mob-qt:active{background:var(--ss-surface-muted,#F3EDE4);}
.ss-mob-qt:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
.ss-mob-qt .ss-mob-icon{color:var(--ss-link,#296093);}
/* 2. úroveň */
.ss-mob-all{min-height:52px;background:var(--ss-surface-subtle,#FAF5EF);font-size:16px;font-weight:600;color:var(--ss-link,#296093);}
/* Příznak TIP u nejprodávanější kategorie (4. 11. 2026) */
.ss-tipbadge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;background:#FBB255;color:#1C2229;font-family:Roboto,Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;line-height:1;text-transform:uppercase;}
.ss-mob-cat{min-height:56px;font-size:18px;font-weight:600;}
.ss-mob-sep{display:block;height:1px;margin:8px 0;background:var(--ss-border-subtle,#E1E6EB);}
.ss-mob-cat[data-best="true"]{color:var(--ss-text-heading,#0B1F33);}
.ss-mob-chips{display:flex;flex-direction:column;gap:8px;padding:0 var(--ss-ov-pad,16px) 12px;} /* nadpis řady = stejný řádek jako ostatní kategorie (4. 11. 2026) */
.ss-mob-chips-t{display:inline-flex;align-items:center;gap:4px;min-height:32px;font-size:15px;font-weight:600;color:var(--ss-text-secondary,#3D4750);}
.ss-mob-chips-row{display:flex;flex-wrap:wrap;gap:8px;}
.ss-mob-chip{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;background:var(--ss-surface-page,#FFFFFF);box-shadow:inset 0 0 0 1px var(--ss-border-strong,#C8D0D8);font-size:15px;font-weight:600;color:var(--ss-text-primary,#1C2229);white-space:nowrap;}
.ss-mob-chip:active{background:var(--ss-surface-muted,#F3EDE4);}
.ss-mob-chip-sep{display:block;flex:none;width:1px;height:28px;margin:0 4px;background:var(--ss-border-strong,#C8D0D8);align-self:center;}
.ss-mob-chip:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(41,96,147,.35);}
/* Promo / průvodce a Poradíme až za kategoriemi */
.ss-mob-extra{display:flex;flex-direction:column;gap:8px;padding:16px var(--ss-ov-pad,16px) 24px;border-top:1px solid var(--ss-border-subtle,#E1E6EB);margin-top:8px;}
.ss-mob-tile{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px 10px 10px;border-radius:12px;background:var(--ss-action-tonal-bg,#FEEDD4);color:var(--ss-text-primary,#1C2229);}
.ss-mob-tile[data-kind="guide"]{background:#132C43;color:#FFFFFF;}

</helmet>
<div class="ss-mob">
  <sc-if value="{{ isRoot }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="Hlavní sekce" style="display:flex;flex-direction:column;padding:8px 0">
      <sc-for list="{{ sections }}" as="c" hint-placeholder-count="8">
        <a class="ss-mob-row ss-mob-sec" href="{{ c.href }}" data-hl="{{ c.hl }}" onClick="{{ c.onOpen }}">
          <span class="ss-mob-ph" aria-hidden="true"><span style="{{ c.imgStyle }}"></span></span>
          <span style="flex:1;min-width:0">{{ c.label }}</span>
          <span class="ss-mob-icon"><dc-import name="Ikony" iconName="chevron-right" size="22" hint-size="22px,22px"></dc-import></span>
        </a>
      </sc-for>
    </nav>
    <div class="ss-mob-quick" role="group" aria-label="Rychlé zkratky">
      <sc-for list="{{ quick }}" as="q" hint-placeholder-count="4">
        <sc-if value="{{ q.isStores }}" hint-placeholder-val="{{ false }}">
          <button type="button" class="ss-mob-qt" onClick="{{ toggleStores }}" aria-expanded="{{ storesExpanded }}">
            <span class="ss-mob-icon"><dc-import name="Ikony" iconName="{{ q.icon }}" size="22" hint-size="22px,22px"></dc-import></span>
            <span style="flex:1;min-width:0">{{ q.label }}</span>
            <span class="ss-mob-icon"><dc-import name="Ikony" iconName="{{ storesChevron }}" size="18" hint-size="18px,18px"></dc-import></span>
          </button>
        </sc-if>
        <sc-if value="{{ q.isLink }}" hint-placeholder-val="{{ true }}">
          <a class="ss-mob-qt" href="{{ q.href }}">
            <span class="ss-mob-icon"><dc-import name="Ikony" iconName="{{ q.icon }}" size="22" hint-size="22px,22px"></dc-import></span>
            <span style="flex:1;min-width:0">{{ q.label }}</span>
          </a>
        </sc-if>
      </sc-for>
    </div>
    <sc-if value="{{ storesOpen }}" hint-placeholder-val="{{ false }}">
      <div style="padding:0 0 8px">
        <dc-import name="ProdejnyMenu" compact="{{ true }}" hint-size="100%,420px"></dc-import>
      </div>
    </sc-if>
    <div style="border-top:1px solid var(--ss-border-subtle,#E1E6EB);padding:8px 0 24px;display:flex;flex-direction:column">
      <sc-for list="{{ utility }}" as="u" hint-placeholder-count="1">
        <a class="ss-mob-row" href="{{ u.href }}" style="color:var(--ss-text-secondary,#3D4750)"><span class="ss-mob-icon"><dc-import name="Ikony" iconName="phone" size="20" hint-size="20px,20px"></dc-import></span><span>{{ u.label }}</span></a>
      </sc-for>
      <a class="ss-mob-row" href="#prihlaseni" style="color:var(--ss-text-secondary,#3D4750)">
        <span class="ss-mob-icon"><dc-import name="Ikony" iconName="user" size="20" hint-size="20px,20px"></dc-import></span>
        <span>Přihlášení a registrace</span>
      </a>
      <a class="ss-mob-row" href="#oblibene" style="color:var(--ss-text-secondary,#3D4750)">
        <span class="ss-mob-icon"><dc-import name="Ikony" iconName="heart" size="20" hint-size="20px,20px"></dc-import></span>
        <span>Oblíbené</span>
      </a>
      <a class="ss-mob-row" href="#porovnani" style="color:var(--ss-text-secondary,#3D4750)">
        <span class="ss-mob-icon"><dc-import name="Ikony" iconName="arrows-diff" size="20" hint-size="20px,20px"></dc-import></span>
        <span>Porovnání</span>
      </a>
    </div>
  </sc-if>

  <sc-if value="{{ isSection }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="{{ secLabel }}" style="display:flex;flex-direction:column;padding:0 0 8px">
      <a class="ss-mob-row ss-mob-all" href="{{ allHref }}">
        <span style="flex:1;min-width:0">{{ allLabel }}</span>
        <span class="ss-mob-icon" style="color:inherit"><dc-import name="Ikony" iconName="arrow-right" size="20" hint-size="20px,20px"></dc-import></span>
      </a>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
        <sc-if value="{{ r.isChips }}" hint-placeholder-val="{{ false }}">
          <a class="ss-mob-row ss-mob-cat" href="{{ r.href }}">
            <span class="ss-mob-ph" data-size="sm" aria-hidden="true"><span style="{{ r.imgStyle }}"></span></span>
            <span style="flex:1;min-width:0">{{ r.title }}</span>
            <span class="ss-mob-icon"><dc-import name="Ikony" iconName="chevron-right" size="20" hint-size="20px,20px"></dc-import></span>
          </a>
          <div class="ss-mob-chips" role="group" aria-label="{{ r.title }}">
            <div class="ss-mob-chips-row">
              <sc-for list="{{ r.items }}" as="i" hint-placeholder-count="8">
                <sc-if value="{{ i.sepBefore }}" hint-placeholder-val="{{ false }}"><span class="ss-mob-chip-sep" role="separator"></span></sc-if>
                <a class="ss-mob-chip" href="{{ i.href }}" data-link="{{ i.linkStr }}">{{ i.label }}</a>
              </sc-for>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ r.isCat }}" hint-placeholder-val="{{ true }}">
          <sc-if value="{{ r.sepBefore }}" hint-placeholder-val="{{ false }}"><span class="ss-mob-sep" role="separator"></span></sc-if>
          <a class="ss-mob-row ss-mob-cat" href="{{ r.href }}" data-link="{{ r.linkStr }}" data-best="{{ r.bestStr }}">
            <span class="ss-mob-ph" data-size="sm" aria-hidden="true"><span style="{{ r.imgStyle }}"></span></span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px"><span>{{ r.title }}</span><sc-if value="{{ r.isBest }}" hint-placeholder-val="{{ false }}"><span class="ss-tipbadge">Tip</span></sc-if></span>
            <span class="ss-mob-icon"><dc-import name="Ikony" iconName="{{ r.chev }}" size="20" hint-size="20px,20px"></dc-import></span>
          </a>
        </sc-if>
      </sc-for>
    </nav>
    <sc-if value="{{ hasExtra }}" hint-placeholder-val="{{ false }}">
      <div class="ss-mob-extra">
        <sc-if value="{{ hasTile }}" hint-placeholder-val="{{ false }}">
          <a class="ss-mob-tile" data-kind="{{ tile.kind }}" href="{{ tile.href }}" target="{{ tile.target }}" rel="{{ tile.rel }}" onClick="{{ tile.onClick }}">
            <sc-if value="{{ tile.hasImage }}" hint-placeholder-val="{{ false }}"><span class="ss-mob-ph" aria-hidden="true"><span style="{{ tile.imgStyle }}"></span></span></sc-if>
            <sc-if value="{{ tile.hasIcon }}" hint-placeholder-val="{{ true }}"><span class="ss-mob-tile-ico" aria-hidden="true"><dc-import name="Ikony" iconName="{{ tile.icon }}" size="22" hint-size="22px,22px"></dc-import></span></sc-if>
            <span style="flex:1;min-width:0"><span class="ss-mob-tile-k">{{ tile.kicker }}</span><span class="ss-mob-tile-t">{{ tile.title }}</span><sc-if value="{{ tile.hasSub }}" hint-placeholder-val="{{ false }}"><span class="ss-mob-tile-s">{{ tile.sub }}</span></sc-if></span>
          </a>
        </sc-if>
        <sc-for list="{{ articles }}" as="a" hint-placeholder-count="2">
          <a class="ss-mob-art" href="{{ a.href }}" target="{{ a.target }}" rel="{{ a.rel }}" onClick="{{ a.onClick }}">
            <span class="ss-mob-icon"><dc-import name="Ikony" iconName="book" size="20" hint-size="20px,20px"></dc-import></span>
            <span style="flex:1;min-width:0">Poradíme: {{ a.title }}</span>
          </a>
        </sc-for>
      </div>
    </sc-if>
  </sc-if>
</div>
</x-dc>

// Obsah okna Menu (mobil) – rám, hlavička a chování dodává Overlay (drawer zprava). Rozhraní: data {categories?, utility?} + onEvent('close').
class Component extends DCLogic {
  // Mobilní menu v2 (4. 11. 2026). Rozhraní: data { section: index otevřené sekce | null, categories?, quick?, utility? }, onEvent('open', i) | ('back') | ('close').
  // Název úrovně a šipku zpět zobrazuje Overlay (title + onBack), stav otevřené sekce drží Hlavicka.
  state = { cats: null, quick: null, util: null, storesOpen: false };
  componentDidMount() {
    const d0 = this.props.data || {};
    if (!d0.categories) Promise.resolve(__M_menu).then(m => this.setState({ cats: m.MENU, quick: m.QUICK, util: m.UTILITY }));
  }
  renderVals() {
    const p = this.props;
    const d = p.data || {};
    const cats = d.categories || this.state.cats || [];
    const quick = d.quick || this.state.quick || [];
    const utility = (d.utility || this.state.util || []).filter(u => u.label === 'Kontakty');
    const emit = (t, a) => { if (p.onEvent) p.onEvent(t, a); };
    const scrollTop = (e) => { try { const b = e && e.target && e.target.closest('.ss-ov-body'); if (b) b.scrollTop = 0; } catch (err) {} };
    const bg = (src, size) => ({ display: 'block', width: '100%', height: '100%', background: src ? 'url(' + src + ') center / ' + (size || 'cover') + ' no-repeat' : 'none' });
    const thumb = (src) => bg(src, 'contain'); // miniatury kategorií: celá fotka na bílém, nikdy neořezávat (4. 11. 2026)
    const si = (d.section === undefined || d.section === null || d.section === '') ? -1 : +d.section;
    const sec = si >= 0 ? cats[si] : null;
    const vals = {
      isRoot: !sec,
      isSection: !!sec,
      sections: cats.map((c, i) => ({
        label: c.label, href: c.href || '#', hl: c.highlight ? 'true' : 'false', imgStyle: thumb(c.image),
        onOpen: (e) => { if (!(c.groups && c.groups.length)) return; e.preventDefault(); scrollTop(e); emit('open', i); }
      })),
      quick: quick.map(q => ({ label: q.label, href: q.href || '#', icon: q.icon || 'chevron-right', isStores: q.href === '#prodejny', isLink: q.href !== '#prodejny' })),
      utility,
      storesOpen: !!this.state.storesOpen,
      storesExpanded: this.state.storesOpen ? 'true' : 'false',
      storesChevron: this.state.storesOpen ? 'chevron-up' : 'chevron-down',
      toggleStores: () => this.setState(s => ({ storesOpen: !s.storesOpen })),
      close: () => emit('close'),
      secLabel: '', allLabel: '', allHref: '#', rows: [], hasExtra: false, hasTile: false, tile: {}, articles: []
    };
    if (sec) {
      const groups = sec.groups || [];
      const rows = [];
      // ★ Nejprodávanější jako první kategorie, pak rozměry / cenová pásma jako tlačítka, pak ostatní kategorie (žluté podkategorie se v mobilu nezobrazují)
      const best = groups.filter(g => g.best);
      const chips = groups.filter(g => g.chips === 'sizes' || g.chips === 'prices');
      const rest = groups.filter(g => !g.best && !(g.chips === 'sizes' || g.chips === 'prices'));
      const cat = (g) => ({ isCat: true, isChips: false, title: g.title, href: g.href || '#', imgStyle: thumb(g.image), linkStr: g.link ? 'true' : 'false', bestStr: g.best ? 'true' : 'false', isBest: !!g.best, chev: 'chevron-right', sepBefore: false });
      best.forEach(g => rows.push(cat(g)));
      const order = (arr) => { const a = (arr || []).filter(i => !i.link), b = (arr || []).filter(i => i.link); return a.concat(b); };
      chips.forEach(g => { const it = order(g.items); rows.push({ isChips: true, isCat: false, title: g.title, href: g.href || '#', imgStyle: thumb(g.image), items: it.map((i, k) => ({ label: i.label, href: i.href || '#', linkStr: i.link ? 'true' : 'false', sepBefore: false /* odkazy do jiné sekce bez oddělovače, jako běžná podkategorie (6. 11. 2026) */ })) }); });
      // odkazy do jiné sekce až na konec, oddělené čarou
      const restO = order(rest);
      restO.forEach((g, k) => rows.push(Object.assign(cat(g), { sepBefore: false /* odkazy do jiné sekce bez oddělovače, jako běžná podkategorie (6. 11. 2026) */ })));
      const top = sec.top || [];
      const KICK = { promo: 'Tip', guide: 'Průvodce', article: 'Poradíme' };
      const ext = (h) => false; // 11. 11. 2026: na přání klienta i externí články (magazín) ve stejné záložce
      const t = top.find(x => x.kind === 'guide') || top.find(x => x.kind === 'promo');
      const articles = top.filter(x => x.kind === 'article').slice(0, 2).map(a => ({ title: a.title || a.label, href: a.href || '#', target: ext(a.href) ? '_blank' : undefined, rel: ext(a.href) ? 'noopener' : undefined, onClick: ext(a.href) ? (e => { if (e && e.preventDefault) e.preventDefault(); try { window.open(a.href, '_blank', 'noopener'); } catch (err) { window.location.href = a.href; } }) : undefined }));
      Object.assign(vals, {
        secLabel: sec.label,
        allLabel: (sec.all && sec.all.label) || ('Zobrazit vše v sekci ' + sec.label),
        allHref: (sec.all && sec.all.href) || sec.href || '#',
        rows,
        hasExtra: !!t || articles.length > 0,
        hasTile: !!t,
        tile: t ? { kind: t.kind, href: t.href || '#', target: ext(t.href) ? '_blank' : undefined, rel: ext(t.href) ? 'noopener' : undefined, onClick: ext(t.href) ? (e => { if (e && e.preventDefault) e.preventDefault(); try { window.open(t.href, '_blank', 'noopener'); } catch (err) { window.location.href = t.href; } }) : undefined, kicker: KICK[t.kind] || 'Tip', title: t.title || t.label || '', sub: t.sub || '', hasSub: !!t.sub, hasImage: !!t.image, imgStyle: bg(t.image, t.imageFit), hasIcon: !t.image, icon: t.kind === 'guide' ? 'help-circle' : 'tag' } : {},
        articles
      });
    }
    return vals;
  }
}
